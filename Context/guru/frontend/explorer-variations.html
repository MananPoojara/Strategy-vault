<main class="page" id="stage"><div class="loading">Loading the vault from the Rust API…</div></main>
<script>
const API = new URLSearchParams(location.search).get('api') || `http://${location.hostname || 'localhost'}:8090`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 1, s = false) => v == null || !isFinite(v) ? '–' : (s && v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const fx = (v, d = 2) => v == null || !isFinite(v) ? '–' : v.toFixed(d);
const cls = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const med = a => { const s = a.filter(isFinite).sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const LABEL = { 'NIFTY 50': 'Nifty 50', NIFTYBANK: 'Bank Nifty', NIFTYIT: 'Nifty IT', NIFTYMIDCAP100: 'Midcap 100' };
const CLOTH = ['#1f3a5f', '#7a2e2e', '#2f5140', '#8a6a2f', '#4a5563', '#5b3b5e'];

// ---------------------------------------------------------------- the library (hierarchy: guru → book → strategy → variant)
// Only Connors / Swing Trading College IX is converted. The rest are clearly marked previews (no numbers) so the layout
// shows how the vault grows; they become live automatically once their strategies exist in the API.
const LIB = [
  { id: 'connors', name: 'Larry Connors', photo: 'img/gurus/connors.jpg', books: [
    { id: 'stc9', title: 'Swing Trading College IX', year: 2010, live: true },
    { id: 'stts', title: 'Short Term Trading Strategies That Work', year: 2008 },
    { id: 'hpetf', title: 'High Probability ETF Trading', year: 2009 }] },
  { id: 'raschke', name: 'Linda Raschke', books: [{ id: 'smarts', title: 'Street Smarts', year: 1995 }] },
  { id: 'minervini', name: 'Mark Minervini', books: [{ id: 'wizard', title: 'Trade Like a Stock Market Wizard', year: 2013 }, { id: 'champion', title: 'Think & Trade Like a Champion', year: 2017 }] },
  { id: 'oneil', name: "William O'Neil", books: [{ id: 'canslim', title: 'How to Make Money in Stocks', year: 1988 }] },
  { id: 'darvas', name: 'Nicolas Darvas', books: [{ id: 'darvas2m', title: 'How I Made $2,000,000 in the Stock Market', year: 1960 }] },
  { id: 'livermore', name: 'Jesse Livermore', books: [{ id: 'howtotrade', title: 'How to Trade in Stocks', year: 1940 }] },
];
const BOOK = {}; LIB.forEach(g => g.books.forEach((b, k) => { b.guru = g; b.c = CLOTH[(LIB.indexOf(g) * 2 + k) % CLOTH.length]; BOOK[b.id] = b; }));
const GURU = Object.fromEntries(LIB.map(g => [g.id, g]));

// ---------------------------------------------------------------- state (kept in the URL hash so any view can be shared)
const DEF = { mode: 'strategies', market: 'india', tk: 'NIFTY 50', tab: 'sharpe', q: '', guru: '', book: '', style: '', dir: '', hold: '', verdict: '', min: '0', family: '', sort: 'primary', view: 'grid' };
let S = { ...DEF };
const readHash = () => { const q = new URLSearchParams(location.hash.slice(1)); S = { ...DEF }; for (const k in DEF) if (q.has(k)) S[k] = q.get(k); };
const writeHash = () => { const q = new URLSearchParams(); for (const k in DEF) if (S[k] !== DEF[k]) q.set(k, S[k]); history.replaceState(null, '', '#' + q); };

let CAT = [], TICKERS = [], GURUS_API = [];
const SUM = {}; // `${tk}|${from}|${to}` -> { id: {stats, spark} }
async function getSum(tk, from = '', to = '') {
  const k = `${tk}|${from}|${to}`;
  const url = `${API}/api/guru/connors/summary?` + new URLSearchParams({ ticker: tk, from, to });
  const load = async (tries = 3) => { try { const a = await (await fetch(url)).json(); return Object.fromEntries(a.map(r => [r.id, r])); }
    catch (e) { if (tries <= 1) { delete SUM[k]; throw e; } await new Promise(r => setTimeout(r, 300)); return load(tries - 1); } };
  return SUM[k] || (SUM[k] = load());
}
// "before the book" numbers come from the per-strategy endpoint: the summary endpoint crashes when the end date
// is before the first India VIX bar (VIX strategies), while /run answers that case cleanly.
const PRE = {};
function preMap(tk, to) {
  const k = `${tk}|${to}`;
  if (PRE[k]) return PRE[k];
  const ids = CAT.filter(v => v.status === 'live' && !v.needs_vix).map(v => v.id), out = {}; // VIX data starts after 2009: nothing to ask
  let i = 0;
  const worker = async () => { while (i < ids.length) { const id = ids[i++];
    try { const r = await fetch(`${API}/api/guru/connors/run?` + new URLSearchParams({ id, ticker: tk, to })); if (r.ok) out[id] = { stats: (await r.json()).stats }; } catch (e) { /* leave missing */ } } };
  return PRE[k] = Promise.all(Array.from({ length: 6 }, worker)).then(() => out);
}
const lastOf = tk => TICKERS.find(t => t.ticker === tk)?.last || '2026-05-15';
const shiftYears = (d, y) => { const t = new Date(d); t.setFullYear(t.getFullYear() - y); return t.toISOString().slice(0, 10); };

// tabs: which data window each one uses and which number it ranks by
const PUB = 2010;
const TABS = {
  trending: { name: 'Trending', note: 'Ranked by the return of the last 12 months on the selected index: what is working right now.',
    win: tk => ({ from: shiftYears(lastOf(tk), 1), to: '' }), extra: () => ({ from: '', to: '' }),
    metric: { label: '12M return', get: r => r.s.total_return, fmt: v => pct(v, 1, true), bins: [-.1, -.05, 0, .05, .1, .2] }, keep: r => r.s.trades > 0 },
  sharpe: { name: 'Top Sharpe', note: 'Full history on the selected index, ranked by Sharpe ratio (rf = 0, daily, √252).',
    win: () => ({ from: '', to: '' }), metric: { label: 'Sharpe', get: r => r.s.sharpe, fmt: v => fx(v), bins: [0, .25, .5, .75, 1, 1.5] } },
  working: { name: 'Still working?', note: `Out-of-sample check: Sharpe since the book was published (${PUB}) next to Sharpe before it. A strategy that only worked before publication has decayed.`,
    win: () => ({ from: `${PUB}-01-01`, to: '' }), pre: `${PUB - 1}-12-31`,
    metric: { label: `Sharpe since ${PUB}`, get: r => r.s.sharpe, fmt: v => fx(v), bins: [0, .25, .5, .75, 1, 1.5] } },
  sig: { name: 'Significant', note: 'Only rule sets whose average trade is statistically significant: t-stat ≥ 2 with at least 30 closed trades.',
    win: () => ({ from: '', to: '' }), metric: { label: 't-stat', get: r => r.s.t_stat, fmt: v => fx(v), bins: [2, 2.5, 3, 4, 5, 6] }, keep: r => r.s.t_stat >= 2 && r.s.trades >= 30 },
  awaiting: { name: 'Awaiting data', note: 'Rules transcribed from the book that cannot be tested yet: they need data the vault does not have (TRIN breadth, options chains, single stocks).' },
};
const SORTS = { primary: 'Tab ranking', sharpe: 'Sharpe', cagr: 'CAGR', maxdd: 'Smallest drawdown', win: 'Win rate', pf: 'Profit factor', trades: 'Most trades', t: 't-stat', name: 'Name (A–Z)', course: 'Order in the book' };
const sortVal = (r, k) => ({ primary: TABS[S.tab].metric?.get(r), sharpe: r.s.sharpe, cagr: r.s.cagr, maxdd: r.s.max_dd, win: r.s.win_rate, pf: r.s.profit_factor, trades: r.s.trades, t: r.s.t_stat }[k]);
function sortRows(rows) {
  const k = S.sort;
  if (k === 'name') return rows.sort((a, b) => a.v.family_name.localeCompare(b.v.family_name));
  if (k === 'course') return rows.sort((a, b) => a.v.ord - b.v.ord);
  return rows.sort((a, b) => (sortVal(b, k) ?? -1e9) - (sortVal(a, k) ?? -1e9));
}
const verdictOf = s => s.trades < 30 ? { k: 'thin', t: 'THIN DATA', c: '#8a3a2e' } : s.t_stat >= 2 ? { k: 'sig', t: 'SIGNIFICANT', c: '#2e7d4f' } : { k: 'none', t: 'NO EDGE', c: '#6b6f78' };
const holdOf = s => s.avg_bars <= 5 ? 'short' : s.avg_bars <= 20 ? 'swing' : 'long';
const HOLD = { short: '≤ 5 bars', swing: '6–20 bars', long: '> 20 bars' };

// ---------------------------------------------------------------- rows: one per (variant × index) after market, tab and filters
async function rows(S = getS()) { // state can be passed in (facet counts, matrix, columns)
  if (S.market !== 'india') return [];
  const T = TABS[S.tab], tks = S.tk === 'ALL' ? TICKERS.map(t => t.ticker) : [S.tk];
  const qq = S.q.trim().toLowerCase();
  const textOk = v => !qq || `${v.name} ${v.family_name} ${v.variant || ''} ${v.group} ${v.dir} ${BOOK[v.book].title} ${GURU[v.guru].name} ${(v.rules || []).join(' ')}`.toLowerCase().includes(qq);
  const metaOk = v => textOk(v) && (!S.guru || v.guru === S.guru) && (!S.book || v.book === S.book) && (!S.style || v.style === S.style) && (!S.dir || v.dir === S.dir) && (!S.family || v.family === S.family);
  if (S.tab === 'awaiting') return CAT.filter(v => v.status !== 'live' && metaOk(v)).map(v => ({ v, tk: null, s: null }));
  const out = [];
  for (const tk of tks) {
    const w = T.win(tk), main = await getSum(tk, w.from, w.to), ex = T.extra ? T.extra(tk) : null, extra = ex ? await getSum(tk, ex.from, ex.to) : T.pre ? await preMap(tk, T.pre) : null;
    for (const v of CAT) {
      if (v.status !== 'live' || !metaOk(v)) continue;
      const m = main[v.id]; if (!m?.stats || !m.stats.trades) continue; // no data (volume rules on Nifty IT) or no closed trades in the window
      const r = { v, tk, s: m.stats, sp: m.spark, x: extra?.[v.id]?.stats || null, w };
      if (T.keep && !T.keep(r)) continue;
      if (S.hold && holdOf(r.s) !== S.hold) continue;
      if (S.verdict && verdictOf(r.s).k !== S.verdict) continue;
      if (r.s.trades < +S.min) continue;
      out.push(r);
    }
  }
  return sortRows(out);
}

// ---------------------------------------------------------------- small charts
function spark(r, w = 300, h = 86) {
  const a = r.sp || []; if (a.length < 2) return '';
  const L = Math.log, lo = Math.min(...a.map(L)), hi = Math.max(...a.map(L)), n = a.length;
  const X = i => i / (n - 1) * w, Y = v => h - 4 - (L(v) - lo) / ((hi - lo) || 1) * (h - 10);
  const P = a.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const end = new Date(r.w.to || lastOf(r.tk)), start = new Date(end - r.s.years * 365.25 * 864e5);
  const f = (new Date(`${PUB}-01-01`) - start) / (end - start);
  const mark = f > .03 && f < .97 ? `<rect x="${f * w}" y="0" width="${(1 - f) * w}" height="${h}" fill="var(--blue-soft)" opacity=".55"/><line x1="${f * w}" x2="${f * w}" y1="0" y2="${h}" stroke="var(--blue)" stroke-dasharray="3 3" stroke-width="1"/>` : '';
  const small = w < 200; // table rows: no axis labels, the dashed line still marks the book
  return `<svg viewBox="0 0 ${w} ${h + (small ? 0 : 14)}" width="100%" class="strip" role="img" aria-label="Equity curve${mark ? `; shaded part is after the book (${PUB})` : ''}">${mark}<path d="${P}L${w},${h}L0,${h}Z" fill="var(--blue)" opacity=".08"/><path d="${P}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
    ${small ? '' : `<text x="0" y="${h + 12}">${start.getFullYear()}</text>${mark ? `<text x="${f * w}" y="${h + 12}" text-anchor="middle" fill="var(--blue)">book ${PUB} →</text>` : ''}<text x="${w}" y="${h + 12}" text-anchor="end">${end.getFullYear()}</text>`}</svg>`;
}
// strip plot: every strategy of a guru/book as a dot on the tab's metric axis
function stripPlot(vals, w = 300, h = 34) {
  const M = TABS[S.tab].metric; if (!vals.length || !M) return '';
  const b = M.bins, lo = Math.min(b[0], ...vals), hi = Math.max(b[b.length - 1], ...vals), X = v => 6 + (v - lo) / ((hi - lo) || 1) * (w - 12);
  return `<svg viewBox="0 0 ${w} ${h + 12}" width="100%" class="strip" role="img" aria-label="Spread of ${esc(M.label)}"><line x1="6" x2="${w - 6}" y1="${h / 2}" y2="${h / 2}" stroke="var(--rule)"/>
    ${vals.map((v, i) => `<circle cx="${X(v).toFixed(1)}" cy="${h / 2 + ((i % 3) - 1) * 6}" r="4" fill="var(--blue)" opacity=".55"/>`).join('')}
    <line x1="${X(med(vals))}" x2="${X(med(vals))}" y1="3" y2="${h - 3}" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="6" y="${h + 10}">${M.fmt(lo)}</text><text x="${w / 2}" y="${h + 10}" text-anchor="middle" fill="var(--ink)">| median ${M.fmt(med(vals))} · each dot = one strategy</text><text x="${w - 6}" y="${h + 10}" text-anchor="end">${M.fmt(hi)}</text></svg>`;
}
function distBox(rs) {
  const M = TABS[S.tab].metric;
  if (!M || !rs.length) return `<div class="h"><b>Where this view sits</b><span>${rs.length} RESULTS</span></div><div class="muted" style="font-size:13px;padding:20px 0">${S.tab === 'awaiting' ? 'No numbers yet: these rules need data the vault does not have.' : 'Nothing to chart for this selection.'}</div>`;
  const b = M.bins, edges = [-Infinity, ...b, Infinity], vals = rs.map(M.get), cnt = Array(edges.length - 1).fill(0);
  vals.forEach(v => { for (let i = 0; i < cnt.length; i++) if (v >= edges[i] && v < edges[i + 1]) { cnt[i]++; break; } });
  const mx = Math.max(...cnt), W = 420, H = 86, bw = W / cnt.length, md = med(vals);
  const lbl = i => i === 0 ? `<${M.fmt(b[0])}` : i === cnt.length - 1 ? `≥${M.fmt(b[b.length - 1])}` : `${M.fmt(edges[i])}–${M.fmt(edges[i + 1])}`;
  const mi = cnt.findIndex((_, i) => md >= edges[i] && md < edges[i + 1]);
  const top = rs.slice(0, 12).map(M.get);
  return `<div class="h"><b>Where this view sits</b><span>${rs.length} RESULTS · ${S.tk === 'ALL' ? 'ALL INDICES' : esc(LABEL[S.tk]).toUpperCase()}</span></div>
    <svg viewBox="0 0 ${W} ${H + 18}" width="100%" class="strip" role="img" aria-label="Distribution of ${esc(M.label)}">${cnt.map((c, i) => { const hh = c / (mx || 1) * (H - 16); const inTop = top.some(v => v >= edges[i] && v < edges[i + 1]);
      return `<rect x="${i * bw + 2}" y="${H - hh}" width="${bw - 4}" height="${Math.max(1, hh)}" fill="${inTop ? 'var(--blue)' : '#dfe6ef'}"><title>${lbl(i)}: ${c}</title></rect><text x="${i * bw + bw / 2}" y="${H + 14}" text-anchor="middle">${lbl(i)}</text>${c ? `<text x="${i * bw + bw / 2}" y="${H - hh - 3}" text-anchor="middle" fill="var(--ink)">${c}</text>` : ''}`; }).join('')}
      ${mi >= 0 ? `<line x1="${mi * bw + bw / 2}" x2="${mi * bw + bw / 2}" y1="0" y2="${H}" stroke="var(--ink)" stroke-dasharray="2 2"/>` : ''}</svg>
    <div class="foot"><span>Dashed line = median ${M.fmt(md)} · top 12 shown first: ${M.label} ${M.fmt(Math.min(...top))} to ${M.fmt(Math.max(...top))}</span><span>dark = where they sit</span></div>`;
}

// ---------------------------------------------------------------- shared pieces
const appLink = r => `./#/connors/${encodeURIComponent(r.v.id)}`;
const RTAG = { F: 'IF', E: 'ENTRY', A: 'ADD', X: 'EXIT' };
const rulesList = v => `<details class="rules"><summary>Rules as written in the book</summary><ul>${(v.rules || []).map(x => { const [t, ...rest] = x.split('|'); return `<li><span class="t">${RTAG[t] || ''}</span>${esc(rest.join('|') || x)}</li>`; }).join('')}</ul></details>`;
const kpiTriplet = r => {
  const M = TABS[S.tab].metric, s = r.s;
  const second = S.tab === 'working' ? `<div><span>Before ${PUB}</span><b>${fx(r.x?.sharpe)}</b><i>${r.x ? (r.x.sharpe > 0 && s.sharpe > 0 ? 'still working' : s.sharpe > 0 ? 'works since book' : r.x.sharpe > 0 ? 'decayed' : 'never worked') : r.v.needs_vix ? 'no India VIX before 2010' : 'no trades before'}</i></div>`
    : S.tab === 'trending' ? `<div><span>Sharpe (full)</span><b>${fx(r.x?.sharpe)}</b><i>${fx(r.s.trades, 0)} trades in 12M</i></div>`
    : `<div><span>CAGR</span><b class="${cls(s.cagr)}">${pct(s.cagr, 1, true)}</b><i>B&amp;H ${pct(s.bh_cagr, 1, true)}</i></div>`;
  return `<div class="kpis"><div><span>${esc(M.label)}</span><b class="p">${M.fmt(M.get(r))}</b><i>${S.tab === 'sig' ? 'Sharpe ' + fx(s.sharpe) : 'win ' + pct(s.win_rate, 0)}</i></div>${second}<div><span>Max DD</span><b>${pct(Math.abs(s.max_dd), 1)}</b><i>${fx(s.trades, 0)} trades</i></div></div>`;
};
const byline = v => `${esc(GURU[v.guru].name)} · ${esc(BOOK[v.book].title)} (${BOOK[v.book].year}) · Session ${v.session}`;

// ---------------------------------------------------------------- MODES
function viewStrategies(rs, perVariant) {
  // strategies = one entry per family (best variant by the current sort); variants = every rule set
  let list = rs;
  if (!perVariant) { const seen = new Map(); for (const r of rs) { const k = r.v.family; if (!seen.has(k)) seen.set(k, { ...r, all: [] }); seen.get(k).all.push(r); } list = [...seen.values()]; }
  const nVar = r => r.all ? new Set(r.all.map(x => x.v.id)).size : 1, nIdx = r => r.all ? new Set(r.all.map(x => x.tk)).size : 1;
  const title = r => perVariant ? `${esc(r.v.family_name)}` : esc(r.v.family_name);
  const sub = r => perVariant && r.v.variant ? `<b style="font-weight:600">${esc(r.v.variant)}</b> · ` : '';
  if (S.tab === 'awaiting') return awaiting(rs);
  if (S.view === 'table') {
    const M = TABS[S.tab].metric, th = (k, t, n) => `<th class="${n ? 'n' : ''} ${S.sort === k ? 'on' : ''}" data-sort="${k}">${t}</th>`;
    return `<div class="tblwrap"><table class="tbl"><thead><tr><th class="nosort">#</th>${th('name', 'Strategy')}<th class="nosort">Style</th>${S.tk === 'ALL' ? '<th class="nosort">Index</th>' : ''}<th class="nosort">Hold</th><th class="nosort">Equity</th>${th('primary', esc(M.label), 1)}${S.tab === 'working' ? `<th class="n nosort">Before ${PUB}</th>` : S.tab === 'trending' ? '<th class="n nosort">Sharpe (full)</th>' : ''}${th('cagr', 'CAGR', 1)}${th('maxdd', 'Max DD', 1)}${th('win', 'Win', 1)}${th('trades', 'Trades', 1)}${th('t', 't', 1)}<th class="nosort"></th></tr></thead><tbody>
      ${list.map((r, i) => `<tr><td class="rk">${i + 1}</td><td class="nm"><b>${title(r)}</b><span>${sub(r)}${byline(r.v)}${!perVariant && nVar(r) > 1 ? ` · <a href="#" data-fam="${esc(r.v.family)}">${nVar(r)} variants</a>` : ''}</span></td><td>${esc(r.v.style)}<br><span class="muted">${r.v.dir}</span></td>${S.tk === 'ALL' ? `<td>${esc(LABEL[r.tk])}</td>` : ''}<td>${HOLD[holdOf(r.s)]}</td><td style="width:150px">${spark(r, 150, 34)}</td>
        <td class="n p">${M.fmt(M.get(r))}</td>${S.tab === 'working' || S.tab === 'trending' ? `<td class="n">${fx(r.x?.sharpe)}</td>` : ''}<td class="n ${cls(r.s.cagr)}">${pct(r.s.cagr, 1, true)}</td><td class="n">${pct(Math.abs(r.s.max_dd), 1)}</td><td class="n">${pct(r.s.win_rate, 0)}</td><td class="n">${fx(r.s.trades, 0)}</td><td class="n">${fx(r.s.t_stat)}</td><td><a class="go" href="${appLink(r)}" target="_blank">Backtest</a></td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return `<div class="grid">${list.map((r, i) => { const vd = verdictOf(r.s); return `<article class="card">
      <div class="rank"><span>#${i + 1}${S.tk === 'ALL' ? ' · ' + esc(LABEL[r.tk]) : ''}</span><span class="stamp" style="color:${vd.c}">${vd.t}</span></div>
      <h3>${title(r)}</h3><div class="by">${sub(r)}${byline(r.v)}</div>
      ${spark(r)}${kpiTriplet(r)}
      <div class="tags"><span class="tag">⏱ ${HOLD[holdOf(r.s)]}</span><span class="tag">${esc(r.v.style)}</span><span class="tag">${r.v.dir}</span>${!perVariant && nVar(r) > 1 ? `<span class="tag link" data-fam="${esc(r.v.family)}">${nVar(r)} variants →</span>` : ''}${!perVariant && S.tk === 'ALL' && nIdx(r) > 1 ? `<span class="tag">best of ${nIdx(r)} indices</span>` : ''}</div>
      ${rulesList(r.v)}
      <div class="btns"><a class="btn solid" href="${appLink(r)}" target="_blank">Full backtest</a><button class="btn" data-book="${r.v.book}">Book</button><button class="btn" data-guru="${r.v.guru}">Guru</button></div>
    </article>`; }).join('')}</div>`;
}
function awaiting(rs) {
  if (S.view === 'table') return `<div class="tblwrap"><table class="tbl"><thead><tr><th class="nosort">#</th><th class="nosort">Strategy</th><th class="nosort">Style</th><th class="nosort">Why it is waiting</th></tr></thead><tbody>${rs.map((r, i) => `<tr><td class="rk">${i + 1}</td><td class="nm"><b>${esc(r.v.family_name)}</b><span>${r.v.variant ? esc(r.v.variant) + ' · ' : ''}${byline(r.v)}</span></td><td>${esc(r.v.style)}</td><td>${esc(r.v.status_note || r.v.status)}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="grid">${rs.map((r, i) => `<article class="card"><div class="rank"><span>#${i + 1}</span><span class="stamp" style="color:#8a6a2f">AWAITING DATA</span></div><h3>${esc(r.v.family_name)}</h3><div class="by">${r.v.variant ? esc(r.v.variant) + ' · ' : ''}${byline(r.v)}</div><p style="margin:0;font-size:13px">${esc(r.v.status_note || r.v.status)}</p><div class="tags"><span class="tag">${esc(r.v.style)}</span><span class="tag">${r.v.dir}</span></div>${rulesList(r.v)}</article>`).join('')}</div>`;
}

// ---------------------------------------------------------------- 4. MARKET MATRIX
async function Lmatrix() {

  if (S.market !== 'india' || !M) return `<div class="topbar2">${marketSeg()}${tabPills()}</div>${S.tab === 'awaiting' ? `<p class="note">${TABS.awaiting.note}</p>` + results(await rows()) : results([])}`;
  const all = await rows({ ...S, tk: 'ALL' }), tks = TICKERS.map(t => t.ticker);
  const key = { gurus: r => r.v.guru, books: r => r.v.book, strategies: r => r.v.family, variants: r => r.v.id }[S.mode];
  const name = { gurus: k => GURU[k].name, books: k => BOOK[k].title, strategies: k => CAT.find(v => v.family === k).family_name, variants: k => { const v = CAT.find(x => x.id === k); return `${v.family_name}${v.variant ? ' · ' + v.variant.split(' · ')[0] : ''}`; } }[S.mode];
  const agg = (S.mode === 'gurus' || S.mode === 'books') ? a => med(famBest(a).map(M.get)) : a => M.get(a[0]); // best variant per cell; median of strategies for gurus/books

    const vals = cells.filter(Boolean).map(c => c.v); return { k, a, cells, avg: vals.reduce((x, y) => x + y, 0) / (vals.length || 1), pos: vals.filter(v => v > (S.tab === 'sig' ? 2 : 0)).length, n: vals.length, r0: a[0] }; });
  lines.sort(S.sort === 'name' ? (x, y) => name(x.k).localeCompare(name(y.k)) : S.sort === 'course' ? (x, y) => x.r0.v.ord - y.r0.v.ord : (x, y) => y.avg - x.avg);

    body = `<div class="tblwrap"><table class="tbl heat"><thead><tr><th class="nosort">${{ gurus: 'Guru', books: 'Book', strategies: 'Strategy', variants: 'Rule variant' }[S.mode]}</th>${tks.map(t => `<th class="n nosort">${esc(LABEL[t])}</th>`).join('')}<th class="n nosort">Average</th><th class="n nosort">Works on</th></tr></thead><tbody>
      ${[...byG.entries()].map(([g, ls]) => `${g ? `<tr class="gr"><td colspan="${tks.length + 3}">${esc(g)}</td></tr>` : ''}${ls.map(l => `<tr><td class="nm"><b>${esc(name(l.k))}</b>${S.mode === 'strategies' ? `<span>${esc(l.r0.v.style)} · ${l.r0.v.dir}</span>` : ''}</td>${l.cells.map(c => `<td class="n hc" style="background:${col(c?.v)};color:${ink(c?.v)}">${c ? (cellLink(c) ? `<a href="${cellLink(c)}" target="_blank">${M.fmt(c.v)}</a>` : M.fmt(c.v)) : '<span class="muted">n/a</span>'}</td>`).join('')}<td class="n"><b>${M.fmt(l.avg)}</b></td><td class="n">${l.pos} / ${l.n}</td></tr>`).join('')}`).join('')}</tbody></table></div>`;
  } else {

      <div class="mini">${l.cells.map((c, i) => `<${cellLink(c) ? `a href="${cellLink(c)}" target="_blank"` : 'div'} class="mc" style="background:${col(c?.v)};color:${ink(c?.v)}"><span>${esc(LABEL[tks[i]])}</span><b>${c ? M.fmt(c.v) : 'n/a'}</b></${cellLink(c) ? 'a' : 'div'}>`).join('')}</div>

  }

  return `<div class="topbar2">${modeSeg()}${tabPills()}</div><div class="topbar2">${searchBox()}${filterSelects(['guru', 'book', 'style', 'dir', 'hold', 'min'])}${sortSel()}${viewSeg()}</div>${chipsHtml()}
    <div class="bar"><div class="cnt"><b>${lines.length}</b> ${MODES[S.mode].toLowerCase()} × <b>${tks.length}</b> indices · ${TABS[S.tab].name}</div>${legend}</div><p class="note">${TABS[S.tab].note} Columns are the four Indian indices; “works on” counts indices where it is ${S.tab === 'sig' ? 'significant' : 'positive'}.</p>${body}`;

// ---------------------------------------------------------------- 5. RISK–REWARD MAP
async function Lmap(rs) {
  const M = TABS[S.tab].metric;

  const pts = S.mode === 'variants' ? rs : famBest(rs), W = 860, H = 420, P = { l: 56, r: 20, t: 20, b: 44 };
  const xs = pts.map(r => Math.abs(r.s.max_dd)), ys = pts.map(M.get);

  const X = v => P.l + v / xmax * (W - P.l - P.r), Y = v => H - P.b - (v - ylo + pad) / (yhi - ylo + 2 * pad) * (H - P.t - P.b);

  const tmax = Math.max(...pts.map(r => r.s.trades), 1), rad = r => 4 + Math.sqrt(r.s.trades / tmax) * 14;

    <rect x="${P.l}" y="${P.t}" width="${(W - P.l - P.r) / 2}" height="${(Y(ylo) - P.t) / 2 + 0}" fill="#e9f0f7" opacity=".6"/><text x="${P.l + 8}" y="${P.t + 16}" class="q">Low drawdown · high ${esc(M.label)}</text>
    ${ticks(5).map(f => `<line x1="${X(f * xmax)}" x2="${X(f * xmax)}" y1="${P.t}" y2="${H - P.b}" stroke="#e3e3e4"/><text x="${X(f * xmax)}" y="${H - P.b + 16}" text-anchor="middle">${pct(f * xmax, 0)}</text>`).join('')}
    ${ticks(4).map(f => { const v = ylo - pad + f * (yhi - ylo + 2 * pad); return `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e3e4"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${M.fmt(v)}</text>`; }).join('')}
    ${ylo < 0 ? `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#999" stroke-dasharray="3 3"/>` : ''}
    <text x="${(W + P.l) / 2}" y="${H - 6}" text-anchor="middle" class="ax">Max drawdown → (left is safer)</text><text x="14" y="${(H - P.b) / 2}" text-anchor="middle" class="ax" transform="rotate(-90 14 ${(H - P.b) / 2})">${esc(M.label)} ↑</text>
    ${pts.slice().sort((a, b) => b.s.trades - a.s.trades).map(r => `<circle class="dot ${pick && pid(r) === S.pick ? 'on' : ''}" data-set="${ds({ pick: pid(r) === S.pick ? '' : pid(r) })}" cx="${X(Math.abs(r.s.max_dd)).toFixed(1)}" cy="${Y(M.get(r)).toFixed(1)}" r="${rad(r).toFixed(1)}" fill="${colorBy(r)}" fill-opacity=".55" stroke="${colorBy(r)}"><title>${esc(r.v.family_name)}${r.v.variant ? ' · ' + esc(r.v.variant) : ''}${S.tk === 'ALL' ? ' · ' + esc(LABEL[r.tk]) : ''}
${esc(M.label)} ${M.fmt(M.get(r))} · max DD ${pct(Math.abs(r.s.max_dd), 1)} · ${r.s.trades} trades</title></circle>`).join('')}
    ${pts.slice(0, 6).map(r => `<text x="${X(Math.abs(r.s.max_dd)) + rad(r) + 3}" y="${Y(M.get(r)) + 4}" class="lab2">${esc(r.v.family_name.length > 22 ? r.v.family_name.slice(0, 21) + '…' : r.v.family_name)}</text>`).join('')}</svg>`;
  const legend = S.mode === 'gurus' ? LIB.filter(g => rs.some(r => r.v.guru === g.id)).map((g, i) => `<span><i style="background:${CLOTH[LIB.indexOf(g) % 6]}"></i>${esc(g.name)}</span>`).join('')
    : S.mode === 'books' ? [...new Set(rs.map(r => r.v.book))].map(b => `<span><i style="background:${BOOK[b].c}"></i>${esc(BOOK[b].title)}</span>`).join('')
    : `<span><i style="background:#2e7d4f"></i>Significant</span><span><i style="background:#6b6f78"></i>No edge</span><span><i style="background:#8a3a2e"></i>Thin data</span>`;
  const keep = S.mode; S.mode = S.mode === 'variants' ? 'variants' : 'strategies';
  const kv = S.view; S.view = 'grid'; const card = pick ? viewStrategies([pick], true).replace('<div class="grid">', '<div>') : `<div class="hint2"><b>Click a dot</b>Its full card appears here. Bigger dots traded more; the shaded corner is where you want to be.</div>`;
  S.view = kv; const list = results(rs); S.mode = keep;

    <div class="topbar2">${searchBox()}${filterSelects(['guru', 'book', 'style', 'dir', 'hold', 'min'])}</div>${chipsHtml()}
    <div class="L5"><div class="plot">${svg}<div class="legend2">${legend}<span class="muted">· dot size = trades</span></div></div><aside>${card}</aside></div>

// ---------------------------------------------------------------- 6. QUERY BAR + SAVED VIEWS
const QKEYS = ['tab', 'index', 'mode', 'guru', 'book', 'style', 'dir', 'hold', 'verdict', 'min', 'sort', 'view'];
function toQuery() {
  const t = [];
  const add = (k, v) => t.push(`${k}:${/\s/.test(v) ? `"${v}"` : v}`);
  if (S.tab !== DEF.tab) add('tab', S.tab); if (S.market !== 'india') add('market', S.market); else if (S.tk !== DEF.tk) add('index', S.tk === 'ALL' ? 'all' : LABEL[S.tk]);
  if (S.mode !== DEF.mode) add('mode', S.mode); if (S.guru) add('guru', S.guru); if (S.book) add('book', S.book); if (S.style) add('style', S.style); if (S.dir) add('dir', S.dir.toLowerCase());
  if (S.hold) add('hold', S.hold); if (S.verdict) add('verdict', S.verdict); if (S.min !== '0') add('min', S.min); if (S.family) add('family', S.family); if (S.sort !== 'primary') add('sort', S.sort); if (S.view !== 'grid') add('view', S.view);
  if (S.q) t.push(/\s/.test(S.q) ? `"${S.q}"` : S.q);
  return t.join(' ');
}
function fromQuery(text) {
  const n = { ...DEF, layout: S.layout }, words = [], bad = [];
  for (const m of text.matchAll(/(\w+):"([^"]*)"|(\w+):(\S+)|"([^"]*)"|(\S+)/g)) {
    const k = (m[1] || m[3] || '').toLowerCase(), v = m[2] ?? m[4];
    if (!k) { words.push(m[5] ?? m[6]); continue; }
    const lv = v.toLowerCase();
    if (k === 'tab' && TABS[lv]) n.tab = lv;
    else if (k === 'index') n.tk = lv === 'all' ? 'ALL' : (TICKERS.find(t => t.ticker.toLowerCase() === lv || (LABEL[t.ticker] || '').toLowerCase() === lv || (LABEL[t.ticker] || '').toLowerCase().replace(/\s/g, '') === lv.replace(/\s/g, ''))?.ticker || (bad.push(m[0]), n.tk));
    else if (k === 'market' && ['india', 'global', 'stocks'].includes(lv)) n.market = lv;
    else if (k === 'mode' && MODES[lv]) n.mode = lv;
    else if (k === 'guru') n.guru = LIB.find(g => g.id === lv || g.name.toLowerCase().includes(lv))?.id || (bad.push(m[0]), '');
    else if (k === 'book') n.book = Object.values(BOOK).find(b => b.id === lv || b.title.toLowerCase().includes(lv))?.id || (bad.push(m[0]), '');
    else if (k === 'style') n.style = [...new Set(CAT.map(x => x.style))].find(x => x.toLowerCase().includes(lv)) || (bad.push(m[0]), '');
    else if (k === 'dir' && ['long', 'short'].includes(lv)) n.dir = lv === 'long' ? 'Long' : 'Short';
    else if (k === 'hold' && HOLD[lv]) n.hold = lv;
    else if (k === 'verdict' && VERD[lv]) n.verdict = lv;
    else if (k === 'min' && /^\d+$/.test(v)) n.min = v;
    else if (k === 'family') n.family = v;
    else if (k === 'sort' && SORTS[lv]) n.sort = lv;
    else if (k === 'view' && ['grid', 'table'].includes(lv)) n.view = lv;
    else bad.push(m[0]);

}
const PRESETS = [
  ['Working right now', 'Best last-12-month return on Nifty 50', { tab: 'trending' }],
  ['Edge on every index', 'Significant rule sets across all four indices, as a table', { tab: 'sig', tk: 'ALL', view: 'table' }],
  ['Survived the book', 'Out-of-sample since 2010 with at least 30 trades', { tab: 'working', min: '30' }],
  ['Short-side ideas', 'Strategies that sell short', { dir: 'Short' }],
  ['Quick, shallow trades', '≤ 5-bar holds sorted by smallest drawdown', { hold: 'short', sort: 'maxdd', min: '30' }],
  ['Book by book', 'Every book with its best and median strategy', { mode: 'books' }],
  ['Bank Nifty leaders', 'Top Sharpe on Bank Nifty', { tk: 'NIFTYBANK' }],
  ['Needs more data', 'Rules that cannot be tested yet', { tab: 'awaiting' }],
];
let QERR = [];
async function Lquery(rs) {
  const q = toQuery();
  return `<div class="qbar"><span class="qi">⌘</span><input id="query" value="${esc(q)}" placeholder="e.g.  tab:trending index:all dir:short hold:short sort:maxdd  rsi" spellcheck="false"><button class="qgo" id="qrun">Run</button></div>
    <div class="qhelp">${QKEYS.map(k => `<code data-ins="${k}:">${k}:</code>`).join('')}<span>· free words search names and rules · <code data-ins='index:all '>index:all</code> <code data-ins='tab:working '>tab:working</code> <code data-ins='verdict:sig '>verdict:sig</code></span></div>
    ${QERR.length ? `<p class="qerr">Not understood: ${QERR.map(esc).join(', ')}</p>` : ''}
    <div class="presets">${PRESETS.map(([t, d, o]) => { const on = Object.entries(o).every(([k, v]) => S[k] === v) && Object.keys(DEF).filter(k => !(k in o) && !['layout', 'pick', 'group'].includes(k)).every(k => S[k] === DEF[k]); return `<button class="pre ${on ? 'on' : ''}" data-set="${ds({ ...Object.fromEntries(Object.keys(DEF).filter(k => !['layout'].includes(k)).map(k => [k, DEF[k]])), ...o })}"><b>${t}</b><span>${d}</span></button>`; }).join('')}</div>
    <div class="bar"><div class="cnt">${countLine(rs)}</div>${viewSeg()}</div><p class="note">${TABS[S.tab].note}</p>${results(rs)}`;
}

// ---------------------------------------------------------------- render + events
let busy2 = 0;
async function render() {
  writeHash(); const my = ++busy2;
  document.querySelectorAll('#lay button').forEach(b => b.classList.toggle('on', b.dataset.l === S.layout));
  $('#ldesc').innerHTML = `<b>${LAYOUTS[S.layout].name}.</b> ${LAYOUTS[S.layout].desc}`;
  $('#status').textContent = S.market === 'india' ? `India · ${S.tk === 'ALL' ? 'all indices' : LABEL[S.tk]} · ${TABS[S.tab].name}` : `${S.market} · no data yet`;
  $('#stage').style.opacity = .55;
  const rs = await rows();
  const html = await { facets: Lfacets, columns: Lcolumns, league: Lleague, matrix: Lmatrix, map: Lmap, query: Lquery }[S.layout](rs);
  if (my !== busy2) return;
  const hadFocus = document.activeElement?.id; const pos = document.activeElement?.selectionStart;
  $('#stage').innerHTML = html; $('#stage').style.opacity = 1;
  if (hadFocus && $('#' + hadFocus)) { const el = $('#' + hadFocus); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
}
const set = patch => { Object.assign(S, patch); if ('guru' in patch && !('book' in patch) && S.book && BOOK[S.book].guru.id !== S.guru) S.book = ''; render(); };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set], [data-l], [data-ins], #qrun, button, a, .tag, th'); if (!t) return;
  const d = t.dataset;
  if (d.l) return set({ layout: d.l, pick: '' });
  if (d.set != null) { e.preventDefault(); return set(Object.fromEntries(new URLSearchParams(d.set))); }
  if (d.ins) { const i = $('#query'); i.value = (i.value.trim() + ' ' + d.ins).trimStart(); i.focus(); return; }
  if (t.id === 'qrun') { const { n, bad } = fromQuery($('#query').value); QERR = bad; S = n; return render(); }
  // links from the shared grid/table renderers
  if (d.sort) return set({ sort: d.sort });
  if (d.fam) { e.preventDefault(); return set({ family: d.fam, mode: 'variants' }); }
  if (d.book) return set({ book: d.book, guru: BOOK[d.book].guru.id, mode: 'strategies' });
  if (d.guru) return set({ guru: d.guru, book: '', mode: 'books' });
  if (d.guruStrats) return set({ guru: d.guruStrats, book: '', mode: 'strategies' });
});
document.addEventListener('change', e => { const k = e.target.dataset?.key; if (k) set({ [k]: e.target.value || (k === 'min' ? '0' : '') }); });
let qt2; document.addEventListener('input', e => { if (e.target.id !== 'q') return; clearTimeout(qt2); qt2 = setTimeout(() => set({ q: e.target.value }), 250); });
document.addEventListener('keydown', e => { if (e.target.id === 'query' && e.key === 'Enter') $('#qrun').click(); });
addEventListener('hashchange', () => { readHash(); render(); });

(async function init() {
  try {
    const get = async u => (await fetch(API + u)).json();
