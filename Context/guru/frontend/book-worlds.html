.w15 .folder { max-width: 1240px; margin: 26px auto 0; background: #e9c98a; padding: 30px 14px 14px; border-radius: 4px 14px 4px 4px; position: relative; box-shadow: 0 16px 34px #0000002a; }
.w15 .folder::before { content: attr(data-tab); position: absolute; top: -24px; left: 30px; background: #e9c98a; padding: 4px 18px; border-radius: 8px 8px 0 0; font: 600 13px "IBM Plex Sans"; }

/* ================================================================== 16 READING TABLE */

/* one stats style everywhere: worlds differ by representation, not by colour */
.world .sheet { --pp: #fff !important; --ink: #1d2330 !important; --ink2: #5b6272 !important; --ac: #1f3a5f !important; --rule: #e3e1db !important; --hc: #1d2330 !important;
  --hf: "Newsreader", serif !important; --nf: "Newsreader", serif !important; --bf: "IBM Plex Sans", sans-serif !important; background: #fff !important; padding: 26px 30px !important; border-radius: 6px; }

.world .sheet td + td, .world .sheet th + th { border-left: 0 !important; } .world .sheet tr:nth-child(even) td { background: none !important; } .world .sheet th { border-top: 0 !important; border-bottom: 1px solid var(--ink) !important; color: var(--ink2) !important; }

</style>
</head>
<body>
<header class="picker"><div class="row"><h1>Book Worlds</h1><nav id="pick"></nav></div><form class="ctl" id="ctl"><select id="ct"></select><label>From <input type="date" id="cf"></label><label>To <input type="date" id="cto"></label><label>Cost <input type="number" id="cc" min="0" step="1" style="width:64px"> bps</label><button>Run</button></form><p class="desc" id="desc"></p></header>
<main id="stage"></main>
<div class="modal" id="modal"><div id="mbody" class="world" style="width:100%;display:flex;justify-content:center"></div></div>

<script>
const API = new URLSearchParams(location.search).get('api') || `http://${location.hostname || 'localhost'}:8090`;
// index, dates and cost come from the page URL (?ticker=&from=&to=&cost=), same parameters as the main app
const RQ = new URLSearchParams([...new URLSearchParams(location.search)].filter(([k]) => ['ticker', 'from', 'to', 'cost'].includes(k))); if (!RQ.get('ticker')) RQ.set('ticker', 'NIFTY 50');
const LABEL = { 'NIFTY 50': 'Nifty 50', NIFTYBANK: 'Bank Nifty', NIFTYIT: 'Nifty IT', NIFTYMIDCAP100: 'Midcap 100' }[RQ.get('ticker')] || RQ.get('ticker');
const RANGE = LABEL + (RQ.get('from') || RQ.get('to') ? `, ${RQ.get('from') || 'start'} to ${RQ.get('to') || 'end'}` : ', full history');
const COST = +RQ.get('cost') > 0 ? `at ${+RQ.get('cost')} bps a side` : 'at zero cost';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 1, s = false) => v == null ? '–' : (s && v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const fx = (v, d = 2) => v == null ? '–' : v.toFixed(d);
const cls = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const PHOTO = 'img/gurus/connors.jpg';
const CLOTH = ['#1f3a5f', '#7a2e2e', '#2f5140', '#8a6a2f', '#4a5563', '#5b3b5e', '#2d4f5c', '#6b3f2a'];
let D = null; const RUNS = {}; let cleanup = [];
const run = async id => RUNS[id] || (RUNS[id] = await (await fetch(`${API}/api/guru/connors/run?id=${id}&${RQ}`)).json());
const verdictOf = s => s.trades < 30 ? { t: 'THIN DATA', c: '#7a2e2e' } : s.t_stat >= 2 ? { t: 'SIGNIFICANT', c: '#2f6b4a' } : { t: 'NO EDGE', c: '#4a5563' };

// ------------------------------------------------------------------ charts (SVG)
function eqChart(d, w = 520, h = 150) {
  const st = Math.max(1, Math.floor(d.equity.length / 260)), e = d.equity.filter((_, i) => i % st === 0), b = d.bh.filter((_, i) => i % st === 0), dt = d.dates.filter((_, i) => i % st === 0);
  const L = Math.log, all = e.concat(b).map(L), lo = Math.min(...all), hi = Math.max(...all), n = e.length, X = i => 34 + i / (n - 1) * (w - 38), Y = v => h - 14 - (L(v) - lo) / ((hi - lo) || 1) * (h - 22);
  const P = v => v.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('');
  const yrs = [...new Set(dt.map(t => t.slice(0, 4)))].filter((_, k, a) => k % Math.ceil(a.length / 6) === 0);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%"><line x1="34" x2="${w - 4}" y1="${Y(1)}" y2="${Y(1)}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/>
    <text x="0" y="${Y(Math.exp(hi)) + 8}" font-size="9" fill="currentColor" fill-opacity=".6">${Math.exp(hi).toFixed(1)}×</text><text x="0" y="${Y(1) + 3}" font-size="9" fill="currentColor" fill-opacity=".6">1×</text>
    ${yrs.map(y => { const i = dt.findIndex(t => t.startsWith(y)); return `<text x="${X(i)}" y="${h - 2}" font-size="9" fill="currentColor" fill-opacity=".55" text-anchor="middle">${y}</text>`; }).join('')}
    <path d="${P(b)}" fill="none" stroke="#a8a297" stroke-width="1.3"/><path d="${P(e)}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg>`;
}
function ddChart(d, w = 520, h = 60) {
  const st = Math.max(1, Math.floor(d.equity.length / 260)); let pk = -1; const dd = d.equity.filter((_, i) => i % st === 0).map(v => { pk = Math.max(pk, v); return v / pk - 1; });
  const lo = Math.min(...dd, -.01), n = dd.length, P = dd.map((x, i) => `${i ? 'L' : 'M'}${(34 + i / (n - 1) * (w - 38)).toFixed(1)},${(2 + x / lo * (h - 6)).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%"><text x="0" y="${h - 4}" font-size="9" fill="currentColor" fill-opacity=".6">${(lo * 100).toFixed(0)}%</text><path d="${P}L${w - 4},2L34,2Z" fill="#b43a3426"/><path d="${P}" fill="none" stroke="#b43a34" stroke-width="1.1"/></svg>`;
}
function periods(d, len) { const o = {}; let base = d.equity[0], key = d.dates[0].slice(0, len); d.dates.forEach((t, i) => { const k = t.slice(0, len); if (k !== key) { o[key] = d.equity[i - 1] / base - 1; base = d.equity[i - 1]; key = k; } }); o[key] = d.equity[d.equity.length - 1] / base - 1; return o; }
function yearBars(d, w = 520, h = 80) {
  const s = periods(d, 4), b = periods({ dates: d.dates, equity: d.bh }, 4), ks = Object.keys(s), mx = Math.max(.01, ...ks.map(k => Math.max(Math.abs(s[k]), Math.abs(b[k])))), bw = (w - 30) / ks.length, Y = v => h / 2 - v / mx * (h / 2 - 4);
  return `<svg viewBox="0 0 ${w} ${h + 12}" width="100%"><line x1="30" x2="${w}" y1="${h / 2}" y2="${h / 2}" stroke="currentColor" stroke-opacity=".3"/>${ks.map((k, i) => { const x = 30 + i * bw; return `<rect x="${x + 1}" y="${Math.min(Y(s[k]), h / 2)}" width="${Math.max(1, bw / 2 - 1)}" height="${Math.max(.5, Math.abs(Y(s[k]) - h / 2))}" fill="${s[k] >= 0 ? 'var(--ac)' : '#b43a34'}"/><rect x="${x + bw / 2}" y="${Math.min(Y(b[k]), h / 2)}" width="${Math.max(1, bw / 2 - 1)}" height="${Math.max(.5, Math.abs(Y(b[k]) - h / 2))}" fill="#a8a297"/>${i % 5 === 0 ? `<text x="${x + bw / 2}" y="${h + 10}" font-size="8.5" text-anchor="middle" fill="currentColor" fill-opacity=".55">${k}</text>` : ''}`; }).join('')}</svg>`;
}
function heat(d) {
  const m = periods(d, 7), ys = periods(d, 4), cap = Math.max(.01, ...Object.values(m).map(Math.abs)), M = 'JFMAMJJASOND';
  const bg = v => v == null ? 'transparent' : Math.abs(v) < 1e-9 ? 'color-mix(in srgb, currentColor 6%, transparent)' : `color-mix(in srgb, ${v > 0 ? 'var(--ac)' : '#b43a34'} ${Math.round((Math.min(1, Math.abs(v) / cap) * .75 + .12) * 100)}%, transparent)`;
  return `<table class="heat"><tr><th></th>${[...M].map(x => `<th>${x}</th>`).join('')}<th>Yr</th></tr>${Object.keys(ys).reverse().map(y => `<tr><th>${y.slice(2)}</th>${[...M].map((_, k) => { const v = m[`${y}-${String(k + 1).padStart(2, '0')}`]; return `<td style="background:${bg(v)}" title="${y}-${k + 1}: ${v == null ? '–' : pct(v, 2, true)}">${v == null || Math.abs(v) < 1e-9 ? '' : (v * 100).toFixed(0)}</td>`; }).join('')}<td class="${cls(ys[y])}"><b>${(ys[y] * 100).toFixed(0)}</b></td></tr>`).join('')}</table>`;
}
function hist(rets, w = 520, h = 80) {
  if (!rets.length) return '<div class="cap">No closed trades.</div>';
  const lo = Math.min(...rets), hi = Math.max(...rets), nb = Math.min(30, Math.max(8, Math.ceil(Math.sqrt(rets.length) * 1.4))), bw0 = (hi - lo) / nb || .001, c = Array(nb).fill(0);
  rets.forEach(r => c[Math.min(nb - 1, Math.floor((r - lo) / bw0))]++); const mx = Math.max(...c), bw = (w - 10) / nb;
  return `<svg viewBox="0 0 ${w} ${h + 12}" width="100%">${c.map((v, k) => { const mid = lo + (k + .5) * bw0, bh = v / mx * (h - 4); return `<rect x="${5 + k * bw + 1}" y="${h - bh}" width="${bw - 2}" height="${bh}" fill="${mid >= 0 ? 'var(--ac)' : '#b43a34'}"><title>${pct(lo + k * bw0)} to ${pct(lo + (k + 1) * bw0)}: ${v}</title></rect>`; }).join('')}<text x="5" y="${h + 10}" font-size="9" fill="currentColor" fill-opacity=".6">${pct(lo, 1)}</text><text x="${w - 5}" y="${h + 10}" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".6">${pct(hi, 1)}</text></svg>`;
}

// ------------------------------------------------------------------ rules, checks
function rulesHtml(c) {
  const sec = { F: [], E: [], A: [], X: [] };
  for (const r of c.rules) { const [t, ...x] = r.split('|'); (sec[t] || sec.E).push(x.join('|')); }
  const o = r => /^(Buy|Short|Sell|Cover|Next day|No other signal|Once|After|Stop)/.test(r);
  const b = (t, col, it) => it.length ? `<div class="lb"><i style="background:${col}"></i>${t}</div>${it.map(r => `<div class="rl ${o(r) ? 'o' : ''}">${o(r) ? '→ ' : '· '}${esc(r)}</div>`).join('')}` : '';
  return b('CONDITIONS', '#555', sec.F) + b('ENTRY', 'var(--ac)', sec.E) + b('SCALE-IN', '#8b93a1', sec.A) + b(sec.X.length > 1 ? 'EXIT (FIRST TO HAPPEN)' : 'EXIT', '#b43a34', sec.X);
}
function exitCheck(t) {
  const x = t.at_exit, r = t.reason, f1 = n => n == null ? '–' : n.toFixed(1), sg = n => (n > 0 ? '+' : '') + n.toFixed(2) + '%';
  let m = r.match(/^RSI\((\d)\) ([<>]) (\d+)/); if (m) { const th = +m[3]; return { ok: m[2] === '>' ? x.rsi2 > th : x.rsi2 < th, text: `RSI(2) ${f1(x.rsi2)}` }; }
  if (r === '5 bars held') return { ok: t.bars === 5, text: `${t.bars} bars` };
  if (r.startsWith('Close > 5-day SMA')) return { ok: x.vs_sma5 > 0, text: `${sg(x.vs_sma5)} vs 5-SMA` };
  if (r.startsWith('Close < 5-day SMA')) return { ok: x.vs_sma5 < 0, text: `${sg(x.vs_sma5)} vs 5-SMA` };
  if (r.includes('below 200-day SMA')) return { ok: x.vs_sma200 <= -1.5, text: `${sg(x.vs_sma200)} vs 200-SMA` };
  if (r.includes('above 200-day SMA')) return { ok: x.vs_sma200 >= 1.5, text: `${sg(x.vs_sma200)} vs 200-SMA` };
  if (r.startsWith('Close ≥ 5% profit')) { const g = x.close / t.avg_px - 1; return { ok: g >= .05, text: `${sg(g * 100)} vs entry` }; }
  return null;
}

// ------------------------------------------------------------------ THE TEAR SHEET (all stats)
function sheetHtml(f, c, d, o = {}) {
  const s = d.stats, v = verdictOf(s), cl = c.claim, closed = d.trades.filter(t => !t.open), chk = closed.map(exitCheck).filter(Boolean), pass = chk.filter(x => x.ok).length;
  const vt = f.variants.length > 1 ? `<div class="sec"><h3>Variants in the course</h3><table><tr><th>Variant</th><th class="n">Trades</th><th class="n">Win</th><th class="n">CAGR</th><th class="n">Sharpe</th><th class="n">t</th></tr>${f.variants.map(x => { const ss = D.sum[x.id]?.stats; return `<tr class="${x.id === c.id ? 'b' : ''}"><td>${esc(x.variant)}</td>${ss ? `<td class="n">${fx(ss.trades, 0)}</td><td class="n">${pct(ss.win_rate, 0)}</td><td class="n ${cls(ss.cagr)}">${pct(ss.cagr, 1, true)}</td><td class="n">${fx(ss.sharpe)}</td><td class="n">${fx(ss.t_stat)}</td>` : '<td colspan="5" class="n">no data</td>'}</tr>`; }).join('')}</table></div>` : '';
  const stats = [['Total return', pct(s.total_return, 1, true)], ['B&H total', pct(s.bh_total, 1, true)], ['Volatility', pct(s.vol, 1)], ['Sortino', fx(s.sortino)], ['MAR', fx(s.mar)], ['Days under water', fx(s.max_dd_days, 0)], ['CAGR / exposure', s.exposure ? pct(s.cagr / s.exposure, 1, true) : '–'], ['Capital deployed', pct(s.avg_deployed, 0)], ['Expectancy', pct(s.avg_trade, 3)], ['Median trade', pct(s.median_trade, 3)], ['Avg win', pct(s.avg_win)], ['Avg loss', pct(s.avg_loss)], ['Payoff', fx(s.payoff)], ['Losing streak', fx(s.max_consec_losses, 0)], ['Best trade', pct(s.best, 1, true)], ['Worst trade', pct(s.worst, 1)], ['Avg bars held', fx(s.avg_bars, 1)], ['Trades / year', fx(s.trades_per_year, 1)]];
  return `<div class="sheet ${o.cols === false ? '' : 'cols'}" style="${o.style || ''}">
   <div class="sec wide"><h2 data-vol="${esc(o.vol || '')}">${esc(f.name)}</h2><div class="meta">${c.dir} · ${esc(c.group)} · Session ${c.session}${c.variant ? ` · <b>${esc(c.variant)}</b>` : ''} · ${esc(LABEL)}, ${d.dates[0]} to ${d.dates[d.dates.length - 1]}<span class="stamp" style="color:${v.c}">${v.t}</span></div>
     ${f.variants.length > 1 ? `<div class="vbtn">${f.variants.map(x => `<button data-v="${x.id}" class="${x.id === c.id ? 'on' : ''}">${esc(x.variant.split(' · ')[0])}</button>`).join('')}</div>` : ''}</div>
   <div class="sec"><div class="kp"><div><span>CAGR</span><b class="${cls(s.cagr)}">${pct(s.cagr, 2, true)}</b><i>B&amp;H ${pct(s.bh_cagr, 1, true)}</i></div><div><span>Sharpe</span><b>${fx(s.sharpe)}</b><i>t = ${fx(s.t_stat)}</i></div><div><span>Max DD</span><b class="neg">${pct(s.max_dd, 1)}</b><i>B&amp;H ${pct(s.bh_max_dd, 0)}</i></div><div><span>Win rate</span><b>${pct(s.win_rate, 1)}</b><i>book ${cl ? esc(cl.win) : '–'}</i></div><div><span>Profit factor</span><b>${fx(s.profit_factor)}</b><i>payoff ${fx(s.payoff)}</i></div><div><span>Closed trades</span><b>${fx(s.trades, 0)}</b><i>${pct(s.exposure, 0)} in market</i></div></div>
     <p class="verdict">${fx(s.trades, 0)} trades in ${fx(s.years, 1)} years; ${pct(s.cagr, 2, true)} a year vs ${pct(s.bh_cagr, 2, true)} buy &amp; hold; worst drawdown ${pct(s.max_dd, 1)}. ${s.trades < 30 ? 'Too few trades to judge.' : Math.abs(s.t_stat) >= 2 ? 'The average trade is statistically significant.' : 'The average trade is not statistically significant.'}${cl ? ` Book win rate ${esc(cl.win)} vs ${pct(s.win_rate, 1)} here.` : ''}</p></div>
   <div class="sec"><h3>Rules (as taught)</h3>${rulesHtml(c)}${c.notes ? `<div class="cap" style="margin-top:6px">${esc(c.notes)}</div>` : ''}</div>
   ${vt}
   <div class="sec"><h3>Equity vs buy &amp; hold (log)</h3>${eqChart(d)}<div class="cap">Strategy ${d.equity[d.equity.length - 1].toFixed(2)}× · buy &amp; hold ${d.bh[d.bh.length - 1].toFixed(2)}× (grey)</div><h3 style="margin-top:10px">Drawdown</h3>${ddChart(d)}</div>
   <div class="sec"><h3>Calendar-year returns</h3>${yearBars(d)}<div class="cap">Strategy (colour) vs buy &amp; hold (grey)</div></div>
   <div class="sec"><h3>Trade returns</h3>${hist(closed.map(t => t.ret))}</div>
   <div class="sec"><h3>Monthly returns (%)</h3>${heat(d)}</div>
   <div class="sec"><h3>All statistics</h3><div class="stats">${stats.map(([k, x]) => `<div><span>${k}</span><b class="${String(x).startsWith('-') ? 'neg' : ''}">${x}</b></div>`).join('')}</div></div>
   <div class="sec"><h3>Book vs ${esc(LABEL)}</h3><table><tr><th></th><th class="n">Book</th><th class="n">${esc(LABEL)}</th></tr><tr><td>Trades</td><td class="n">${cl ? esc(cl.trades) : '–'}</td><td class="n">${fx(s.trades, 0)}</td></tr><tr><td>Win rate</td><td class="n">${cl ? esc(cl.win) : '–'}</td><td class="n">${pct(s.win_rate, 1)}</td></tr><tr><td>Avg trade</td><td class="n">${cl ? esc(cl.avg) : '–'}</td><td class="n">${pct(s.avg_trade)}</td></tr><tr><td>Avg hold</td><td class="n">${cl ? esc(cl.hold) : '–'}</td><td class="n">${fx(s.avg_bars, 1)} bars</td></tr></table><div class="cap">${cl ? esc(cl.period) : 'The course gives no statistics.'}</div></div>
   <div class="sec wide"><h3>Trade log (${d.trades.length} trades, newest first)</h3><div class="check">✓ Exit rule re-checked on ${chk.length} of ${closed.length} closed trades: ${pass} pass${pass < chk.length ? `, ${chk.length - pass} fail` : ''}.</div>
     <div class="log"><table><tr><th>#</th><th>Entry</th><th>Signal</th><th>Exit</th><th>Reason</th><th class="n">Pcs</th><th class="n">Avg in</th><th class="n">Out</th><th class="n">Bars</th><th class="n">Return</th></tr>${d.trades.map((t, k) => ({ t, k })).reverse().map(({ t, k }) => { const x = t.open ? null : exitCheck(t); return `<tr><td>${k + 1}</td><td>${t.entry}</td><td>RSI ${fx(t.at_entry.rsi2, 1)}</td><td>${t.open ? 'open' : t.exit}</td><td>${esc(t.reason)}${x ? ` <span class="${x.ok ? 'ok' : 'bad'}">${x.ok ? '✓' : '✗'} ${x.text}</span>` : ''}</td><td class="n">${t.legs.length}</td><td class="n">${fx(t.avg_px)}</td><td class="n">${fx(t.exit_px)}</td><td class="n">${t.bars}</td><td class="n ${cls(t.ret)}">${pct(t.ret, 2, true)}</td></tr>`; }).join('')}</table></div></div>
  </div>`;
}
// render a full sheet into an element; variant buttons re-render in place
async function sheetInto(el, f, vid, o = {}) {
  el.innerHTML = '<div class="loading">Opening the book…</div>';
  const c = f.variants.find(x => x.id === vid) || f.best.c, d = await run(c.id);
  el.innerHTML = sheetHtml(f, c, d, o);

// ------------------------------------------------------------------ boot
let cur = 0;
async function init() {
  const get = async u => (await fetch(API + u)).json();
  const [tickers, gurus, cat, sum] = await Promise.all([get('/api/tickers'), get('/api/gurus'), get('/api/guru/connors/strategies'), get(`/api/guru/connors/summary?${RQ}`)]);
  const byId = Object.fromEntries(sum.map(r => [r.id, r])), fams = [], seen = {};
  for (const c of cat.filter(c => c.status === 'live')) {
    const r = byId[c.id];
    const f = seen[c.family] || (seen[c.family] = fams[fams.push({ id: c.family, name: c.family_name, session: c.session, group: c.group.split(' · ')[0], variants: [], best: null }) - 1]);
    f.variants.push(c); if (r?.stats && (!f.best || r.stats.sharpe > f.best.s.sharpe)) f.best = { c, s: r.stats };
  }
  const live = fams.filter(f => f.best); live.forEach(f => f.s = f.best.s);
  D = { g: gurus[0], fams: live, sum: byId };
  const tk = tickers.find(t => t.ticker === RQ.get('ticker')) || tickers[0], setRange = t => { $('#cf').min = $('#cto').min = t.first; $('#cf').max = $('#cto').max = t.last; $('#cf').value = t.first; $('#cto').value = t.last; };
  $('#ct').innerHTML = tickers.map(t => `<option value="${esc(t.ticker)}">${esc({ 'NIFTY 50': 'Nifty 50', NIFTYBANK: 'Bank Nifty', NIFTYIT: 'Nifty IT', NIFTYMIDCAP100: 'Midcap 100' }[t.ticker] || t.ticker)}${t.has_volume ? '' : ' (no volume)'}</option>`).join('');
  $('#ct').value = tk.ticker; setRange(tk); if (RQ.get('from')) $('#cf').value = RQ.get('from'); if (RQ.get('to')) $('#cto').value = RQ.get('to'); $('#cc').value = RQ.get('cost') || 0;
  $('#ct').onchange = () => setRange(tickers.find(t => t.ticker === $('#ct').value));
  $('#ctl').onsubmit = e => { e.preventDefault(); const q = new URLSearchParams(location.search); q.set('ticker', $('#ct').value); q.set('from', $('#cf').value); q.set('to', $('#cto').value); q.set('cost', $('#cc').value || 0); location.search = q; };
  $('#pick').innerHTML = W.map((w, k) => `<button data-k="${k}">${k + 1}. ${w.name}</button>`).join('');
  $('#pick').querySelectorAll('button').forEach(b => b.onclick = () => show(+b.dataset.k));
  addEventListener('hashchange', () => { const k = +location.hash.slice(1) - 1; if (k !== cur && k >= 0 && k < W.length) show(k); });
  show(Math.max(0, Math.min(W.length - 1, +(location.hash.slice(1) || 1) - 1)));
}
function show(k) {
  cleanup.forEach(f => { try { f(); } catch (e) {} }); cleanup = []; $('#modal').classList.remove('on');
  cur = k; history.replaceState(null, '', '#' + (k + 1)); scrollTo(0, 0);
  document.querySelectorAll('#pick button').forEach(b => b.classList.toggle('on', +b.dataset.k === k));
  $('#desc').innerHTML = `<b>${k + 1}. ${W[k].name}.</b> ${W[k].desc}`;
  $('#stage').innerHTML = W[k].render();
  W[k].after?.();
}
init().catch(e => { $('#stage').innerHTML = `<p style="padding:40px">Could not reach the Rust API at ${API}: ${esc(e.message)}</p>`; });
</script>
