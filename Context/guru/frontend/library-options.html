<style>
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; background: #fff; color: #111; }
.num { font-variant-numeric: tabular-nums; }
.picker { position: sticky; top: 0; z-index: 50; background: #ffffffee; backdrop-filter: blur(10px); border-bottom: 1px solid #e3e6ec; padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.picker h1 { font: 600 15px/1 "IBM Plex Sans"; margin: 0; }
.picker nav { display: flex; gap: 6px; flex-wrap: wrap; }
.picker button { border: 1px solid #dfe3ea; background: #fff; border-radius: 99px; padding: 6px 14px; font: 500 13px "IBM Plex Sans"; cursor: pointer; }
.picker button.on { background: #111; color: #fff; border-color: #111; }
.picker .desc { flex-basis: 100%; font-size: 13px; color: #555; margin: 0; }
.picker .desc b { color: #111; }
.hint { font-size: 12px; color: #777; margin-left: auto; }
.opt { position: relative; min-height: calc(100vh - 92px); overflow: hidden; isolation: isolate; }
.frame { position: relative; max-width: 1320px; margin: 0 auto; padding: 0 36px 60px; }
.pos { color: #2f6b4a; } .neg { color: #b43a34; }
@media (prefers-reduced-motion: reduce) { .opt *, .opt *::before, .opt *::after { animation: none !important; transition: none !important; } }

/* shared: cloth-bound spine colours (book cloth, muted) */
:root { --cloth-1: #1f3a5f; --cloth-2: #7a2e2e; --cloth-3: #2f5140; --cloth-4: #8a6a2f; --cloth-5: #4a5563; --cloth-6: #5b3b5e; --foil: #e8d39a; }

/* =================== 3D book object (shelf) — after petargyurov/virtual-bookshelf =================== */
.shelf-row { display: flex; align-items: flex-end; gap: 6px; padding: 0 30px; perspective: 1400px; min-height: 330px; }
.book3d { --w: 58px; --h: 290px; --d: 200px; position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d; transform-origin: bottom left; transition: transform .8s cubic-bezier(.2,.8,.2,1); cursor: pointer; flex: none; }
.book3d .spine, .book3d .cover { position: absolute; top: 0; height: 100%; backface-visibility: hidden; }
.book3d .spine { left: 0; width: var(--w); background: var(--c); color: var(--foil); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px 0 14px; box-shadow: inset 4px 0 6px -3px #ffffff40, inset -6px 0 8px -4px #00000055; }
.book3d .spine::before, .book3d .spine::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-top: 1px solid var(--foil); border-bottom: 1px solid var(--foil); opacity: .7; }
.book3d .spine::before { top: 30px; } .book3d .spine::after { bottom: 34px; }
.book3d .spine .t { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 17px/1 "Newsreader"; letter-spacing: .02em; white-space: nowrap; margin-top: 30px; }
.book3d .spine .a { font: 500 10px/1.1 "IBM Plex Sans"; opacity: .85; text-align: center; }
.book3d .cover { left: var(--w); width: var(--d); transform-origin: left center; transform: rotateY(90deg); background: var(--c); color: var(--foil); padding: 22px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 8px 0 12px -6px #00000066; }
.book3d .cover .ph { width: 100%; height: 120px; overflow: hidden; border: 2px solid var(--foil); }
.book3d .cover .ph img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(.15); }
.book3d .cover h4 { margin: 0; font: 600 22px/1.05 "Newsreader"; }
.book3d .cover p { margin: 0; font-size: 11px; opacity: .85; }
.book3d:hover, .book3d.open { transform: translateY(-18px) translateX(30px) rotateY(-72deg); z-index: 5; }
.book3d.lean { transform: rotateZ(-7deg); margin-left: 18px; }
.book3d.live .spine { box-shadow: inset 4px 0 6px -3px #ffffff40, inset -6px 0 8px -4px #00000055, 0 0 0 2px var(--foil); }
.book3d.live .spine .a::after { content: 'CONVERTED'; display: block; margin-top: 6px; font: 700 8px/1 'IBM Plex Sans'; letter-spacing: .12em; color: var(--c); background: var(--foil); padding: 3px 2px; }
.book3d.lean:hover { transform: translateY(-18px) translateX(30px) rotateY(-72deg); }

/* =================== 3D hardcover — after scastiel/3d-book-image-css-generator =================== */
.hard { --w: 220px; --h: 310px; --t: 34px; position: relative; width: var(--w); height: var(--h); perspective: 900px; }
.hard .b { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-32deg); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
.hard:hover .b { transform: rotateY(-8deg); }
.hard .front { position: absolute; inset: 0; background: var(--c, #1f3a5f); color: var(--foil); border-radius: 2px 6px 6px 2px; padding: 22px 20px; display: flex; flex-direction: column; justify-content: space-between; transform: translateZ(calc(var(--t) / 2)); box-shadow: inset 6px 0 10px -4px #00000055, 10px 12px 30px #0000002e; overflow: hidden; }
.hard .front::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: #ffffff22; }
.hard .pages { position: absolute; top: 4px; left: calc(var(--w) - var(--t) / 2 - 3px); width: var(--t); height: calc(var(--h) - 8px); transform: rotateY(90deg); background: repeating-linear-gradient(90deg, #fbfbfb 0 2px, #dcdcdc 2px 3px); }
.hard .back { position: absolute; inset: 0; background: var(--c, #1f3a5f); border-radius: 2px 6px 6px 2px; transform: translateZ(calc(var(--t) / -2)); box-shadow: -14px 14px 34px #00000033; }
.hard .front h4 { margin: 0; font: 600 30px/1 "Newsreader"; }
.hard .front .sub { font-size: 12px; opacity: .85; }
.hard .front .ph { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; border: 2px solid var(--foil); }
.hard .front .ph img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }

/* ======================= 1. THE BOOKSHELF ======================= */
.l1 { background: radial-gradient(900px 500px at 50% -10%, #fff8ea, transparent 70%), #f1f2f4; color: #1d2330; font-family: "IBM Plex Sans"; }
.l1 .dust { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.l1 .dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #c9a55a; opacity: 0; animation: mote 16s linear infinite; }
@keyframes mote { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .5; } 85% { opacity: .35; } 100% { transform: translate(40px, -260px); opacity: 0; } }
.l1 .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; border-bottom: 1px solid #d9dbe0; }
.l1 .brand { font: 600 22px "Newsreader"; } .l1 .nav nav { display: flex; gap: 22px; color: #5b6272; } .l1 .nav a.on { color: #1d2330; font-weight: 600; }
.l1 .head { padding: 40px 0 10px; } .l1 .head h2 { font: 600 58px/1 "Newsreader"; margin: 0 0 10px; letter-spacing: -.02em; } .l1 .head p { margin: 0; color: #5b6272; font-size: 17px; max-width: 60ch; }
.l1 .shelf { position: relative; margin-top: 10px; }
.l1 .plank { height: 26px; margin: 0 0 0; background: linear-gradient(180deg, #e2cfa9, #caa972 60%, #a98652); box-shadow: 0 16px 24px -10px #6b4f2a66; border-radius: 2px; }
.l1 .plank-front { height: 10px; background: linear-gradient(180deg, #b8935c, #8f6d3d); }
.l1 .shelf-label { position: absolute; left: 30px; bottom: 44px; font-size: 12px; color: #7a6a4d; }
.l1 .detail { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0; margin-top: 34px; border-top: 2px solid #1d2330; }
.l1 .detail div { padding: 16px 18px 16px 0; } .l1 .detail span { display: block; font-size: 12px; color: #5b6272; } .l1 .detail b { font: 600 34px "Newsreader"; }
.l1 .note { font-size: 13px; color: #5b6272; margin-top: 10px; }

/* ======================= 2. HARDCOVER + CONTENTS ======================= */
.l2 { background: #f5f5f3; color: #1a1a1a; font-family: "Newsreader", Georgia, serif; }
.l2::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.l2 .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; border-bottom: 1px solid #1a1a1a; font-family: "IBM Plex Sans"; }
.l2 .brand { font: italic 600 22px "Newsreader"; } .l2 .nav nav { display: flex; gap: 22px; color: #666; } .l2 .nav a.on { color: #1a1a1a; font-weight: 600; }
.l2 .top { display: grid; grid-template-columns: 300px 1fr; gap: 60px; align-items: center; padding: 56px 0 30px; }
.l2 .shelfrow { display: flex; gap: 34px; padding: 10px 0 0 10px; }
.l2 h2 { font-size: 64px; line-height: .95; margin: 0 0 14px; font-weight: 600; letter-spacing: -.02em; }
.l2 .tag { font-size: 23px; font-style: italic; color: #444; margin: 0 0 16px; max-width: 40ch; }
.l2 .meta { font: 13px "IBM Plex Sans"; color: #666; }
.l2 .toc { margin-top: 20px; border-top: 2px solid #1a1a1a; padding-top: 18px; }
.l2 .toc h3 { font-size: 30px; margin: 0 0 6px; font-weight: 600; }
.l2 .toc .hd { display: grid; grid-template-columns: 1fr 110px 90px 90px; font: 12px "IBM Plex Sans"; color: #777; padding: 8px 0; border-bottom: 1px solid #ccc; }
.l2 .ch { display: grid; grid-template-columns: 1fr 110px 90px 90px; align-items: baseline; padding: 11px 0; border-bottom: 1px dotted #bbb; font-size: 19px; }
.l2 .ch .nm { display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
.l2 .ch .nm small { font: 12px "IBM Plex Sans"; color: #888; white-space: nowrap; }
.l2 .ch .nm::after { content: ""; flex: 1; border-bottom: 2px dotted #aaa; transform: translateY(-4px); min-width: 20px; }
.l2 .ch .n { text-align: right; font: 14px "IBM Plex Mono"; }
.l2 .others { display: flex; gap: 26px; margin-top: 36px; flex-wrap: wrap; }
.l2 .others .hard { --w: 150px; --h: 210px; --t: 24px; } .l2 .others .hard h4 { font-size: 20px; } .l2 .others .p { font: 11px "IBM Plex Sans"; color: #888; margin-top: 8px; }

/* ======================= 3. OPEN BOOK ======================= */
.l3 { background: radial-gradient(1200px 700px at 50% 40%, #fbfbfa, #e7e6e3); color: #222; font-family: "Newsreader", Georgia, serif; }
.l3 .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; font-family: "IBM Plex Sans"; }
.l3 .brand { font: 600 20px "Newsreader"; } .l3 .nav nav { display: flex; gap: 22px; color: #666; } .l3 .nav a.on { color: #222; font-weight: 600; }
.l3 .spread { position: relative; margin: 26px auto 0; max-width: 1180px; display: grid; grid-template-columns: 1fr 1fr; perspective: 2400px; filter: drop-shadow(0 30px 40px #00000026); }
.l3 .page { position: relative; min-height: 680px; padding: 50px 56px 90px; background: #fdfcf9; }
.l3 .page.l { border-radius: 8px 0 0 8px; background: linear-gradient(90deg, #fdfcf9 80%, #efece5); }
.l3 .page.r { border-radius: 0 8px 8px 0; background: linear-gradient(270deg, #fdfcf9 80%, #efece5); }
.l3 .page.l::after, .l3 .page.r::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; }
.l3 .page.l::after { right: 0; background: linear-gradient(90deg, transparent, #00000014); } .l3 .page.r::after { left: 0; background: linear-gradient(270deg, transparent, #00000014); }
.l3 .folio { position: absolute; bottom: 22px; font: 12px "IBM Plex Sans"; color: #999; } .l3 .page.l .folio { left: 56px; } .l3 .page.r .folio { right: 56px; }
.l3 .portrait { width: 190px; height: 230px; float: right; margin: 0 0 14px 22px; overflow: hidden; border: 1px solid #ccc; padding: 6px; background: #fff; }
.l3 .portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.l3 .kicker { font: 600 12px "IBM Plex Sans"; color: #8a6a2f; margin-bottom: 8px; }
.l3 h2 { font-size: 52px; line-height: 1; margin: 0 0 16px; font-weight: 600; }
.l3 .dropcap::first-letter { float: left; font-size: 64px; line-height: .85; padding: 6px 8px 0 0; font-weight: 600; color: #8a6a2f; }
.l3 p { font-size: 17px; line-height: 1.7; margin: 0 0 14px; color: #333; }
.l3 h3 { font-size: 26px; margin: 0 0 12px; font-weight: 600; }
.l3 .idx { list-style: none; margin: 0; padding: 0; }
.l3 .idx li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font-size: 16px; }
.l3 .idx li .fill { flex: 1; border-bottom: 1px dotted #aaa; transform: translateY(-4px); }
.l3 .idx li .v { font: 13px "IBM Plex Mono"; }
.l3 .turn { position: absolute; top: 0; right: 0; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(.3,.7,.2,1); pointer-events: none; }
.l3 .turn .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 0 8px 8px 0; background: linear-gradient(270deg, #fdfcf9 80%, #efece5); }
.l3 .turn .front { padding: 50px 56px; pointer-events: none; }
.l3 .turn .back { transform: rotateY(180deg); border-radius: 8px 0 0 8px; background: linear-gradient(90deg, #fdfcf9 80%, #efece5); padding: 50px 56px; }
.l3.flipped .turn { transform: rotateY(-180deg); }
.l3 .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-top: 18px; }
.l3 .kpis span { font: 12px "IBM Plex Sans"; color: #888; display: block; } .l3 .kpis b { font-size: 34px; font-weight: 600; }
.l3 .btnturn { position: absolute; right: 56px; bottom: 50px; font: 600 13px "IBM Plex Sans"; border: 1px solid #222; background: #fff; padding: 8px 14px; cursor: pointer; pointer-events: auto; z-index: 3; }

/* ======================= 4. CARD CATALOGUE ======================= */
.l4 { background: #eceef1; color: #262a33; font-family: "IBM Plex Mono", monospace; }
.l4 .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; border-bottom: 1px solid #c9ced6; font-family: "IBM Plex Sans"; }
.l4 .brand { font: 600 18px "IBM Plex Mono"; } .l4 .nav nav { display: flex; gap: 22px; color: #5d6472; } .l4 .nav a.on { color: #262a33; font-weight: 600; }
.l4 .drawer { display: flex; gap: 26px; align-items: center; margin: 34px 0 26px; padding: 22px 26px; background: linear-gradient(180deg, #d9dde3, #c9ced6); border: 1px solid #b7bdc7; border-radius: 6px; box-shadow: inset 0 1px 0 #fff, 0 10px 24px #00000014; }
.l4 .labelholder { position: relative; padding: 12px 18px; background: #fbfaf6; border: 3px solid #9aa1ad; border-radius: 3px; min-width: 300px; }
.l4 .labelholder b { display: block; font: 600 22px "IBM Plex Sans"; } .l4 .labelholder span { font-size: 12px; color: #5d6472; }
.l4 .pull { width: 110px; height: 30px; border-radius: 0 0 50px 50px; border: 4px solid #9aa1ad; border-top: 0; }
.l4 .drawer .pic { width: 70px; height: 84px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 6px #0003; transform: rotate(-3deg); } .l4 .drawer .pic img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.l4 .tagline { font: italic 16px "Newsreader"; max-width: 46ch; color: #3a404c; }
.l4 .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }
.l4 .card { position: relative; background: #fffdf7; min-height: 190px; padding: 16px 18px 14px; border-radius: 3px; box-shadow: 0 1px 2px #0002, 0 8px 18px #0000000f;
  background-image: linear-gradient(#fffdf7 34px, transparent 34px), repeating-linear-gradient(#fffdf7 0 21px, #cfe0ef 21px 22px); animation: deal .7s cubic-bezier(.2,.8,.2,1) both; }
.l4 .card::before { content: ""; position: absolute; left: 0; right: 0; top: 34px; border-top: 1.5px solid #d45b5b; }
.l4 .card::after { content: ""; position: absolute; bottom: 10px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #eceef1; box-shadow: inset 0 1px 2px #0003; }
@keyframes deal { from { opacity: 0; transform: translateY(-40px) rotate(-4deg); } }
.l4 .call { font-size: 11px; color: #7d8594; display: flex; justify-content: space-between; }
.l4 .card h4 { font: 600 16px/1.3 "IBM Plex Mono"; margin: 16px 0 6px; }
.l4 .row { font-size: 13px; line-height: 22px; } .l4 .row span { color: #7d8594; }
.l4 .stamp { position: absolute; right: 16px; bottom: 30px; transform: rotate(-9deg); border: 2px solid currentColor; padding: 2px 8px; font: 700 12px "IBM Plex Mono"; letter-spacing: .05em; opacity: .8; }
.l4 .stamp.sig { color: #2f6b4a; } .l4 .stamp.thin { color: #b43a34; } .l4 .stamp.none { color: #7d8594; }

/* ======================= 5. STEEL LIBRARY ======================= */
.l5 { --bg:#e9e9e9; --ink:#090909; --ink2:#636466; --steel:#b0b0b1; background: linear-gradient(180deg, #f1f1f1, var(--bg) 480px); color: var(--ink); font-family: "Archivo"; }
.l5 .g { position: absolute; z-index: -1; width: 1000px; height: 1000px; right: -330px; top: -330px; pointer-events: none; }
.l5 .g svg { width: 100%; height: 100%; animation: spin 360s linear infinite; } .l5 .g path { fill: none; stroke: #09090913; stroke-width: .55; }
@keyframes spin { to { transform: rotate(360deg); } }
.l5 .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; border-bottom: 2px solid var(--ink); }
.l5 .brand { font-weight: 800; font-stretch: 125%; font-size: 18px; } .l5 .nav nav { display: flex; gap: 22px; color: var(--ink2); } .l5 .nav a.on { color: var(--ink); font-weight: 700; }
.l5 .hero { display: grid; grid-template-columns: 1fr 300px; gap: 50px; align-items: center; padding: 56px 0 34px; border-bottom: 1px solid var(--steel); }
.l5 h2 { font-weight: 800; font-stretch: 125%; font-size: 100px; line-height: .9; letter-spacing: -.04em; margin: 0 0 22px; }
.l5 .tag { font-size: 20px; font-stretch: 90%; color: var(--ink2); max-width: 40ch; margin: 0; }
.l5 .hard .front { font-family: "Archivo"; background: #1b1b1c; color: #e9e9e9; } .l5 .hard .back { background: #1b1b1c; } .l5 .hard .front h4 { font: 800 26px/1 "Archivo"; font-stretch: 115%; }
.l5 .hard .front .ph { border-radius: 0; width: 100%; height: 130px; border-color: #e9e9e9; }
.l5 .strip { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--steel); }
.l5 .strip div { padding: 18px 0; } .l5 .strip span { font-size: 12px; color: var(--ink2); display: block; } .l5 .strip b { font-size: 34px; font-weight: 700; font-stretch: 110%; }
.l5 h3 { font-weight: 700; font-stretch: 110%; font-size: 22px; margin: 34px 0 10px; }
.l5 .shelfwrap { border-top: 2px solid var(--ink); padding-top: 26px; }
.l5 .steelplank { height: 18px; background: linear-gradient(180deg, #f7f7f7, #c9c9ca 50%, #a9a9ab); border: 1px solid #9a9a9c; box-shadow: 0 12px 20px -10px #0005; }
.l5 .book3d .spine { background: var(--c); }


/* ======================= 6. THE BOOK (detailed, page-flip) ======================= */
.l6 { background: radial-gradient(1400px 800px at 50% 30%, #f7f6f2, #dcdad4); color: #222; font-family: "Newsreader", Georgia, serif; }
.l6 .nav { display: flex; justify-content: space-between; align-items: center; height: 58px; font-family: "IBM Plex Sans"; }
.l6 .brand { font: 600 20px "Newsreader"; } .l6 .nav nav { display: flex; gap: 22px; color: #666; } .l6 .nav a.on { color: #222; font-weight: 600; }
.l6 .bar { display: flex; justify-content: center; align-items: center; gap: 14px; font: 13px "IBM Plex Sans"; color: #555; margin: 4px 0 10px; }
.l6 .bar button { font: 600 13px "IBM Plex Sans"; border: 1px solid #222; background: #fff; padding: 7px 14px; cursor: pointer; }
.l6 .bar button:disabled { opacity: .35; cursor: default; }
.l6 .bar select { font: 13px "IBM Plex Sans"; padding: 6px 8px; border: 1px solid #bbb; background: #fff; }
.l6 .fit { position: relative; margin: 0 auto; filter: drop-shadow(0 18px 26px #00000030); }
.l6 .bk { position: absolute; left: 0; top: 0; width: 1200px; height: 780px; transform-origin: top left; perspective: 3000px; }
.l6 .slide { position: absolute; inset: 0; transition: transform 1s cubic-bezier(.3,.7,.2,1); }
.l6 .slide.closed { transform: translateX(-25%); } .l6 .slide.ended { transform: translateX(25%); }
.l6 .leaf { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.35,.65,.2,1); }
.l6 .leaf.turned { transform: rotateY(-180deg); }
.l6 .pg { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: #fdfcf9; padding: 54px 56px 64px; cursor: pointer; }
.l6 .pg.front { border-radius: 0 6px 6px 0; background: linear-gradient(270deg, #fdfcf9 85%, #eeebe3); box-shadow: 1px 0 0 #e6e2d8, 2px 0 0 #f4f2ec; }

.full { margin-left: 8px; font-weight: 600; color: #1f3a5f; } .opt .book3d.live, .opt .hard, .opt .toc .ch, .opt .card, .opt .kpis, .opt .portrait { cursor: pointer; }
</style>
</head>
<body>
<header class="picker">
  <h1>Library directions</h1>
  <nav id="pick"></nav>
  <span class="hint">Keys 1–6 · ← → switch options (turn pages in The Book) · real data from the Rust API</span>
  <p class="desc" id="desc"></p>
</header>
<main id="stage"></main>

<script>
const API = new URLSearchParams(location.search).get('api') || `http://${location.hostname || 'localhost'}:8090`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 1, s = false) => v == null ? '–' : (s && v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const fx = (v, d = 2) => v == null ? '–' : v.toFixed(d);
const cls = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const PHOTO = 'img/gurus/connors.jpg';
// preview legends (layout only; not converted, no numbers)
const PREVIEW = [
  { name: 'Linda Raschke', short: 'Raschke', book: 'Street Smarts', c: 'var(--cloth-2)' },
  { name: 'Mark Minervini', short: 'Minervini', book: 'Trade Like a Stock Market Wizard', c: 'var(--cloth-3)' },
  { name: 'Nicolas Darvas', short: 'Darvas', book: 'How I Made $2,000,000', c: 'var(--cloth-4)' },
  { name: "William O'Neil", short: "O'Neil", book: 'How to Make Money in Stocks', c: 'var(--cloth-5)' },
  { name: 'Jesse Livermore', short: 'Livermore', book: 'How to Trade in Stocks', c: 'var(--cloth-6)' },
];

const OPTS = [
  { name: '1. The Bookshelf', desc: 'Legends as cloth-bound books on a shelf. Hover a book and it slides out and turns to show its cover (technique from petargyurov/virtual-bookshelf). Faint dust drifts in the lamplight.', render: l1, after: () => {} },
  { name: '2. Hardcover', desc: 'Each legend is a tilted 3D hardcover (technique from scastiel/3d-book-image-css-generator) that straightens on hover. Strategies read as the book\'s table of contents, with dot leaders.', render: l2 },
  { name: '3. Open Book', desc: 'The legend as an open two-page spread: portrait and thesis on the left, strategy index on the right. "Turn the page" flips to the strongest strategy.', render: l3, after: () => { $('#turn').onclick = () => $('.l3').classList.toggle('flipped'); } },
  { name: '4. Card Catalogue', desc: 'The library card catalogue: a drawer for the legend, and one index card per strategy with its numbers typed on and a verdict stamped on top. Cards deal onto the table once on load.', render: l4 },
  { name: '5. Steel Library', desc: 'Your chosen Steel Deposit + Guilloché look, with the course as a 3D hardcover in the hero and the legends as spines on a steel shelf.', render: l5 },
  { name: '6. The Book', desc: 'The whole Larry Connors course as a book: cover, thesis, contents, a glossary, then one chapter spread per strategy (rules on the left, results on the right). Turn pages with ← →, the buttons, or by clicking a page; click a chapter in the contents to jump.', render: l6, after: bookInit },
];

function guilloche() {
  const paths = [[80, 23, 60, 23], [74, 19, 48, 19], [66, 29, 40, 29]].map(([R, r, d, turns]) => {
    let p = ''; for (let k = 0; k <= 2400; k++) { const t = k / 2400 * Math.PI * 2 * turns; const x = (R - r) * Math.cos(t) + d * Math.cos((R - r) / r * t), y = (R - r) * Math.sin(t) - d * Math.sin((R - r) / r * t); p += `${k ? 'L' : 'M'}${(100 + x * .7).toFixed(2)},${(100 + y * .7).toFixed(2)}`; }
    return `<path d="${p}"/>`; });
  return `<svg viewBox="0 0 200 200">${paths.join('')}</svg>`;
}
function spark(v, w, h, col) {
  if (!v || v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), n = v.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${v.map((x, i) => `${i ? 'L' : 'M'}${(1 + i / (n - 1) * (w - 2)).toFixed(1)},${(h - 1 - (x - lo) / ((hi - lo) || 1) * (h - 2)).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
}

// ---- 3D objects
function spine(title, author, c, extra = '', cover = '') {
  return `<div class="book3d ${extra}" style="--c:${c};--h:${250 + (title.length * 7) % 60}px;--w:${52 + (title.length * 3) % 16}px"><div class="spine"><span class="t">${esc(title)}</span><span class="a">${esc(author)}</span></div><div class="cover">${cover}</div></div>`;
}
function hardcover(title, sub, c, photo) {
  return `<div class="hard"><div class="b"><div class="back" style="--c:${c}"></div><div class="pages"></div><div class="front" style="--c:${c}">${photo ? `<div class="ph"><img src="${PHOTO}" alt=""></div>` : '<div></div>'}<div><h4>${esc(title)}</h4><div class="sub">${esc(sub)}</div></div></div></div></div>`;
}
function connorsCover(D) {
  return `<div class="ph"><img src="${PHOTO}" alt=""></div><h4>${esc(D.g.name)}</h4><p>${esc(D.g.book)}</p><p>${D.fams.length} strategies · best Sharpe ${fx(D.best.s.sharpe)}</p>`;
}

// ---- the five directions
function l1(D) {
  const dust = Array.from({ length: 26 }, (_, k) => `<i style="left:${(k * 37) % 100}%;top:${40 + (k * 53) % 55}%;animation-delay:${(k * 1.3) % 16}s"></i>`).join('');
  return `<section class="opt l1"><div class="dust">${dust}</div><div class="frame">
    <div class="nav"><span class="brand">The Strategy Library</span><nav><a class="on">Guru's</a><a>YT Strategies</a></nav></div>
    <div class="head"><h2>Guru's</h2><p>Every legend is a book on this shelf. Hover a book to pull it out and see its cover; Larry Connors is the only one converted so far.</p></div>
    <div class="shelf"><div class="shelf-row">
      ${spine('Larry Connors', 'Swing Trading College IX', 'var(--cloth-1)', 'live', connorsCover(D))}
      ${PREVIEW.map((p, k) => spine(p.name, p.book, p.c, k === 2 ? 'lean' : '', `<h4>${esc(p.name)}</h4><p>${esc(p.book)}</p><p>Not converted yet</p>`)).join('')}
    </div><div class="plank"></div><div class="plank-front"></div></div>
    <div class="detail"><div><span>Strategies</span><b>${D.fams.length}</b></div><div><span>Rule variants tested</span><b>${D.live}</b></div><div><span>Significant (t ≥ 2)</span><b>${D.sig}</b></div><div><span>Best Sharpe · ${esc(D.best.c.family_name)}</span><b>${fx(D.best.s.sharpe)}</b></div></div>
    <p class="note">Books other than Connors are layout previews: they show how the shelf fills up as more books are converted.</p>
  </div></section>`;
}

function l2(D) {
  return `<section class="opt l2"><div class="frame">
    <div class="nav"><span class="brand">The Strategy Library</span><nav><a class="on">Guru's</a><a>YT Strategies</a></nav></div>
    <div class="top"><div class="shelfrow">${hardcover(D.g.name, 'Swing Trading College IX · 2010', '#1f3a5f', true)}</div>
      <div><h2>${esc(D.g.name)}</h2><p class="tag">${esc(D.g.tagline)}</p><div class="meta">${esc(D.g.book)} · ${D.fams.length} strategies · ${D.live} rule variants tested on Nifty 50</div></div></div>
    <div class="toc"><h3>Contents</h3>
      <div class="hd"><span>Strategy · session</span><span style="text-align:right">CAGR</span><span style="text-align:right">Sharpe</span><span style="text-align:right">Trades</span></div>
      ${D.fams.map(f => `<div class="ch"><span class="nm">${esc(f.name)} <small>${f.n > 1 ? f.n + ' variants · ' : ''}Session ${f.session}</small></span><span class="n ${cls(f.s.cagr)}">${pct(f.s.cagr, 2, true)}</span><span class="n">${fx(f.s.sharpe)}</span><span class="n">${fx(f.s.trades, 0)}</span></div>`).join('')}
    </div>
    <div class="others">${PREVIEW.slice(0, 4).map((p, k) => `<div>${hardcover(p.name, p.book, ['#7a2e2e', '#2f5140', '#8a6a2f', '#4a5563'][k], false)}<div class="p">Layout preview · not converted yet</div></div>`).join('')}</div>
  </div></section>`;
}

function l3(D) {
  const b = D.best;
  return `<section class="opt l3"><div class="frame">
    <div class="nav"><span class="brand">The Strategy Library</span><nav><a class="on">Guru's</a><a>YT Strategies</a></nav></div>
    <div class="spread">
      <div class="page l"><div class="kicker">Legend</div><div class="portrait"><img src="${PHOTO}" alt=""></div><h2>${esc(D.g.name)}</h2>
        <p class="dropcap">${esc(D.g.tagline)} ${esc(D.g.thesis[0].body)}</p>
        <p>${esc(D.g.thesis[4].body)}</p><div class="folio">${esc(D.g.book)}</div></div>
      <div class="page r"><div class="kicker">Chapter · growth of ₹1 on Nifty 50</div><h3>${esc(b.c.family_name)}</h3><div style="margin:18px 0">${spark(b.spark, 460, 200, '#8a6a2f')}</div>
        <p>${fx(b.s.trades, 0)} trades over ${fx(b.s.years, 1)} years, in the market ${pct(b.s.exposure, 0)} of the time; buy &amp; hold compounded ${pct(b.s.bh_cagr, 2, true)} a year over the same window.</p><div class="folio">Tested on Nifty 50</div></div>
      <div class="turn"><div class="face front"><h3>Index of strategies</h3><ul class="idx">${D.fams.map(f => `<li><span>${esc(f.name)}</span><span class="fill"></span><span class="v ${cls(f.s.cagr)}">${pct(f.s.cagr, 1, true)}</span></li>`).join('')}</ul><div class="folio">CAGR of each strategy's best variant</div></div><div class="face back"><div class="kicker">Strongest strategy on Nifty 50</div><h2 style="font-size:40px">${esc(b.c.family_name)}</h2><p style="font-style:italic">${esc(b.c.variant || '')}</p>
        <div class="kpis"><div><span>CAGR</span><b>${pct(b.s.cagr, 2, true)}</b></div><div><span>Sharpe</span><b>${fx(b.s.sharpe)}</b></div><div><span>Max drawdown</span><b class="neg">${pct(b.s.max_dd, 1)}</b></div><div><span>Trades</span><b>${fx(b.s.trades, 0)}</b></div></div>
        <p style="margin-top:22px">${b.s.t_stat >= 2 ? 'Its average trade is statistically different from zero' : 'Its average trade is not statistically significant'} (t = ${fx(b.s.t_stat)}).</p></div></div>
      <button class="btnturn" id="turn">Turn the page ↺</button>
    </div>
  </div></section>`;
}

function l4(D) {
  const stamp = f => f.s.trades < 30 ? '<span class="stamp thin">THIN DATA</span>' : f.s.t_stat >= 2 ? '<span class="stamp sig">SIGNIFICANT</span>' : '<span class="stamp none">NO EDGE</span>';
  return `<section class="opt l4"><div class="frame">
    <div class="nav"><span class="brand">strategy_library/</span><nav><a class="on">Guru's</a><a>YT Strategies</a></nav></div>
    <div class="drawer"><div class="pic"><img src="${PHOTO}" alt=""></div><div class="labelholder"><b>CONNORS, Larry</b><span>Swing Trading College IX · ${D.fams.length} cards</span></div><div class="pull"></div><div class="tagline">${esc(D.g.tagline)}</div></div>
    <div class="cards">${D.fams.map((f, k) => `<div class="card" style="animation-delay:${(k * .06).toFixed(2)}s">
      <div class="call"><span>CON ${String(f.session).padStart(2, '0')}.${String(k + 1).padStart(2, '0')}</span><span>${f.n > 1 ? f.n + ' variants' : 'single'}</span></div>
      <h4>${esc(f.name)}</h4>${stamp(f)}
      <div class="row"><span>CAGR ....</span> <b class="${cls(f.s.cagr)}">${pct(f.s.cagr, 2, true)}</b></div>
      <div class="row"><span>Sharpe ..</span> ${fx(f.s.sharpe)} &nbsp;<span>t</span> ${fx(f.s.t_stat)}</div>
      <div class="row"><span>Trades ..</span> ${fx(f.s.trades, 0)} &nbsp;<span>win</span> ${pct(f.s.win_rate, 0)}</div>
    </div>`).join('')}</div>
  </div></section>`;
}

function l5(D) {
  return `<section class="opt l5"><div class="g">${guilloche()}</div><div class="frame">
    <div class="nav"><span class="brand">STRATEGY VAULT</span><nav><a class="on">Guru's</a><a>YT Strategies</a></nav></div>
    <div class="hero"><div><h2>${esc(D.g.name)}</h2><p class="tag">${esc(D.g.tagline)}</p></div>${hardcover('Swing Trading College IX', D.g.name + ' · 2010 · 14 sessions', '#1b1b1c', true)}</div>
    <div class="strip"><div><span>Strategies</span><b>${D.fams.length}</b></div><div><span>Rule variants tested</span><b>${D.live}</b></div><div><span>Significant (t ≥ 2)</span><b>${D.sig}</b></div><div><span>Best Sharpe</span><b>${fx(D.best.s.sharpe)}</b></div></div>
    <h3>The shelf</h3>
    <div class="shelfwrap"><div class="shelf-row">
      ${spine('Larry Connors', 'Swing Trading College IX', '#1b1b1c', '', connorsCover(D))}
      ${PREVIEW.map((p, k) => spine(p.name, p.book, ['#3a3a3c', '#58585b', '#2c2c2e', '#6b6b6e', '#444446'][k], k === 3 ? 'lean' : '', `<h4>${esc(p.name)}</h4><p>${esc(p.book)}</p><p>Not converted yet</p>`)).join('')}
    </div><div class="steelplank"></div></div>
  </div></section>`;
}


// ---------------------------------------------------------------- 6. THE BOOK
const BK = { cur: 0, n: 0, pages: [] };
function areaChart(v, w, h) {
  if (!v || v.length < 2) return '';
  const lo = Math.min(...v, 1), hi = Math.max(...v, 1), n = v.length, X = i => 30 + i / (n - 1) * (w - 34), Y = x => h - 16 - (x - lo) / ((hi - lo) || 1) * (h - 26);
  const d = v.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
    <line x1="30" x2="${w - 4}" y1="${Y(1)}" y2="${Y(1)}" stroke="#bbb" stroke-dasharray="3 3"/><text x="0" y="${Y(1) + 4}" font-size="10" fill="#999" font-family="IBM Plex Mono">1.0×</text>
    <text x="0" y="${Y(hi) + 4}" font-size="10" fill="#999" font-family="IBM Plex Mono">${hi.toFixed(2)}×</text>
    <path d="${d}L${X(n - 1)},${h - 16}L30,${h - 16}Z" fill="#8a6a2f14"/><path d="${d}" fill="none" stroke="#8a6a2f" stroke-width="2"/>
    <circle cx="${X(n - 1)}" cy="${Y(v[n - 1])}" r="3.5" fill="#8a6a2f"/></svg>`;
}
function rulesHtml(c) {
  const sec = { F: [], E: [], A: [], X: [] };
  for (const r of c.rules) { const [t, ...x] = r.split('|'); (sec[t] || sec.E).push(x.join('|')); }
  const o = r => /^(Buy|Short|Sell|Cover|Next day|No other signal|Once|After|Stop)/.test(r);
  const blk = (t, col, items) => items.length ? `<h4><i style="background:${col}"></i>${t}</h4><ul>${items.map(r => `<li class="${o(r) ? 'o' : ''}">${esc(r)}</li>`).join('')}</ul>` : '';
  return `<div class="rs">${blk('Conditions', '#222', sec.F)}${blk('Entry', '#2f5a8f', sec.E)}${blk('Scale-in', '#7d8395', sec.A)}${blk(sec.X.length > 1 ? 'Exit (whichever comes first)' : 'Exit', '#b43a34', sec.X)}</div>`;
}
function stampOf(s) { return s.trades < 30 ? '<span class="stampx thin">THIN DATA</span>' : s.t_stat >= 2 ? '<span class="stampx sig">SIGNIFICANT</span>' : '<span class="stampx none">NO EDGE</span>'; }
function conclusion(f) {
  const s = f.s, beat = s.cagr > s.bh_cagr;
  if (s.trades < 30) return `Only ${fx(s.trades, 0)} trades on Nifty 50: too few to judge. The rules were built for volatile single stocks; a broad index rarely qualifies.`;
  return `${s.t_stat >= 2 ? 'A real, statistically significant edge' : 'No statistically significant edge'} on Nifty 50 (t = ${fx(s.t_stat)}). ${beat ? 'It beat' : 'It trailed'} buy &amp; hold (${pct(s.cagr, 2, true)} vs ${pct(s.bh_cagr, 2, true)} a year) while in the market ${pct(s.exposure, 0)} of the time, with ${pct(s.max_dd, 1)} worst drawdown vs ${pct(s.bh_max_dd, 1)}.`;
}

function bookPages(D) {
  const g = D.g, P = [];
  const run = (l, r) => `<div class="run"><span>${l}</span><span>${r}</span></div>`;
  // 0 cover (front) · 1 endpaper (back) · 2 title (front) · 3 thesis I (back) · 4 thesis II (front) · 5 contents (back) · 6 glossary (front)
  P.push({ cls: 'cover', html: `<div class="frame2"></div><div class="ph"><img src="${PHOTO}" alt=""></div><h1>${esc(g.name)}</h1><div class="sub">Swing Trading College IX</div><div class="sub" style="font-size:15px">${D.fams.length} strategies, tested on Indian index data</div><div class="imprint">The Strategy Vault · Guru's</div>` });
  P.push({ cls: 'endpaper', html: guilloche() });
  P.push({ html: `<div style="margin-top:120px"><p class="kick">The Strategy Vault presents</p><h2 style="font-size:60px">${esc(g.name)}</h2><p style="font-size:22px;font-style:italic">${esc(g.tagline)}</p>
    <p class="muted" style="margin-top:40px;font-size:15px">${esc(g.book)}.<br>Every rule transcribed from the course slides and back-tested in Rust on Nifty 50, 2000–2026.</p>
    <p class="muted" style="font-size:15px">${D.fams.length} strategies · ${D.live} rule variants · ${D.sig} statistically significant</p></div><div class="folio">i</div>` });
  const th = g.thesis;
  P.push({ html: `${run(esc(g.name), 'The thesis')}<p class="kick" style="margin-top:20px">Part one</p><h2>The Thesis</h2><p class="drop">${esc(th[0].body)}</p>${th.slice(1, 3).map(t => `<h3>${esc(t.title)}</h3><p>${esc(t.body)}</p>`).join('')}<div class="folio">ii</div>` });
  P.push({ html: `${run('The thesis', esc(g.name))}${th.slice(3).map(t => `<h3 style="margin-top:28px">${esc(t.title)}</h3><p>${esc(t.body)}</p>`).join('')}<div class="folio">iii</div>` });
  const firstCh = 7;
  P.push({ html: `${run(esc(g.name), 'Contents')}<p class="kick" style="margin-top:20px">Contents</p><h2>Fourteen strategies</h2><div class="toc">${D.fams.map((f, i) => `<a data-page="${firstCh + i * 2}"><span class="no">${String(i + 1).padStart(2, '0')}</span><span>${esc(f.name)}</span><span class="fill"></span><span class="pn">${firstCh + i * 2}</span></a>`).join('')}<a data-page="${firstCh + D.fams.length * 2}"><span class="no">A</span><span>Appendix: not testable</span><span class="fill"></span><span class="pn">${firstCh + D.fams.length * 2}</span></a></div><div class="folio">iv</div>` });
  P.push({ html: `${run('How to read this book', esc(g.name))}<p class="kick" style="margin-top:20px">Before you start</p><h2>How to read a chapter</h2>
    <p>Each strategy gets one spread. The left page holds the rules exactly as taught; the right page holds what they did on Nifty 50, 2000–2026, at zero cost. Where the course gives variants, the chapter shows the best one and lists the rest.</p>
    <dl class="gl"><dt>CAGR</dt><dd>Compound annual growth of the strategy's equity over the whole test.</dd>
    <dt>Sharpe (rf = 0)</dt><dd>Average daily return ÷ its volatility, annualised with √252. Above 0.5 is decent for a single index timing system.</dd>
    <dt>t-stat</dt><dd>Is the average trade different from zero? |t| ≥ 2 means yes at ~95% confidence: the <b>SIGNIFICANT</b> stamp.</dd>
    <dt>THIN DATA / NO EDGE</dt><dd>Under 30 trades is too few to judge; otherwise, |t| &lt; 2 means the result could be luck.</dd>
    <dt>Max drawdown</dt><dd>Worst fall from a previous equity peak.</dd></dl><div class="folio">v</div>` });
  // chapters: back (left, rules) + front (right, results)
  D.fams.forEach((f, i) => {
    const c = f.best.c, s = f.s, pl = firstCh + i * 2, cl = c.claim;
    P.push({ html: `${run(`Chapter ${i + 1}`, esc(f.name))}<p class="kick" style="margin-top:20px">Chapter ${i + 1} · Session ${c.session}</p><h2>${esc(f.name)}</h2>
      <div class="meta">${c.dir}${f.n > 1 ? ` · ${f.n} variants; shown: <b>${esc(c.variant)}</b>` : ''}</div>${rulesHtml(c)}${c.notes ? `<div class="note">${esc(c.notes)}</div>` : ''}<div class="folio">${pl}</div>` });
    const vt = f.n > 1 ? `<table class="vt"><thead><tr><th>Variant</th><th class="n">Trades</th><th class="n">Win</th><th class="n">CAGR</th><th class="n">Sharpe</th></tr></thead><tbody>${f.variants.map(v => `<tr class="${v.c.id === c.id ? 'b' : ''}"><td>${esc(v.c.variant)}</td><td class="n">${fx(v.s.trades, 0)}</td><td class="n">${pct(v.s.win_rate, 0)}</td><td class="n">${pct(v.s.cagr, 1, true)}</td><td class="n">${fx(v.s.sharpe)}</td></tr>`).join('')}</tbody></table>` : '';
    P.push({ html: `${run(esc(f.name), 'Results on Nifty 50')}${stampOf(s)}<p class="kick" style="margin-top:20px">What happened on Nifty 50</p>
      <div class="kp"><div><span>CAGR</span><b class="${cls(s.cagr)}">${pct(s.cagr, 2, true)}</b><small>B&amp;H ${pct(s.bh_cagr, 1, true)}</small></div><div><span>Sharpe</span><b>${fx(s.sharpe)}</b><small>t = ${fx(s.t_stat)}</small></div><div><span>Max DD</span><b class="neg">${pct(s.max_dd, 1)}</b><small>B&amp;H ${pct(s.bh_max_dd, 0)}</small></div><div><span>Win rate</span><b>${pct(s.win_rate, 0)}</b><small>book ${cl ? esc(cl.win) : '–'}</small></div></div>
      <div class="chart">${areaChart(f.best.spark, 480, f.n > 1 ? 150 : 210)}</div>
      <p class="muted" style="font:12px 'IBM Plex Sans';margin:-4px 0 8px">Growth of ₹1 · ${fx(s.trades, 0)} trades · ${fx(s.years, 1)} years · profit factor ${fx(s.profit_factor)} · ${pct(s.exposure, 0)} time in market</p>
      ${vt}<p class="concl">${conclusion(f)}</p><div class="folio">${pl + 1}</div>` });
  });
  // appendix (back) + back cover (front)
  P.push({ html: `${run('Appendix', esc(g.name))}<p class="kick" style="margin-top:20px">Appendix</p><h2>Not testable here</h2><p>Taught in the course, listed as taught, never approximated.</p>${D.blocked.map(b => `<h3 style="font-size:18px;margin-top:16px">${esc(b.name)}</h3><p style="font-size:14px"><b>Missing:</b> ${esc(b.why)}. ${esc(b.notes)}</p>`).join('')}<div class="folio">${firstCh + D.fams.length * 2}</div>` });
  P.push({ cls: 'back-cover', html: `<div class="frame2" style="position:absolute;inset:28px;border:1.5px solid #e8d39a88"></div><p style="font-size:22px;font-style:italic">“${esc(g.tagline)}”</p><p style="font:12px 'IBM Plex Sans';margin-top:30px">The Strategy Vault · rules computed in Rust</p>` });
  return P;
}

function l6(D) {
  const P = bookPages(D); if (P.length % 2) P.push({ html: '' });
  BK.pages = P; BK.n = P.length / 2; BK.cur = 0;
  const leaves = [];
  for (let k = 0; k < BK.n; k++) {
    const f = P[2 * k], b = P[2 * k + 1];
    leaves.push(`<div class="leaf" data-k="${k}"><div class="pg front ${f.cls || ''}" data-dir="1">${f.html}</div><div class="pg back ${b.cls || ''}" data-dir="-1">${b.html}</div></div>`);
  }
  const opts = D.fams.map((f, i) => `<option value="${7 + i * 2}">Ch. ${i + 1} · ${esc(f.name)}</option>`).join('');
  return `<section class="opt l6"><div class="frame">
    <div class="nav"><span class="brand">The Strategy Library</span><nav><a class="on">Guru's</a><a>YT Strategies</a></nav></div>
    <div class="bar"><button id="bprev">← Previous</button><span id="bpos"></span><select id="bjump"><option value="">Jump to…</option><option value="0">Cover</option><option value="5">Contents</option>${opts}</select><button id="bnext">Next →</button></div>
    <div class="fit" id="bfit"><div class="bk" id="bk"><div class="slide closed" id="bslide">${leaves.join('')}</div></div></div>
  </div></section>`;
}

function bookGo(cur) {
  BK.cur = Math.max(0, Math.min(BK.n, cur));
  document.querySelectorAll('.l6 .leaf').forEach(el => {
    const k = +el.dataset.k, t = k < BK.cur;
    el.classList.toggle('turned', t);
    el.style.zIndex = t ? k + 1 : BK.n - k;   // turned leaves stack left in order, unturned stack right in reverse
  });
  const sl = $('#bslide'); sl.classList.toggle('closed', BK.cur === 0); sl.classList.toggle('ended', BK.cur === BK.n);
  $('#bprev').disabled = BK.cur === 0; $('#bnext').disabled = BK.cur === BK.n;
  const l = 2 * BK.cur - 1, r = 2 * BK.cur;
  $('#bpos').textContent = BK.cur === 0 ? 'Cover' : BK.cur === BK.n ? 'Back cover' : `Pages ${l}–${r} of ${BK.pages.length - 1}`;
}
const bookPage = p => bookGo(p % 2 ? (p + 1) / 2 : p / 2);   // show page p (odd = left, even = right)
function bookFit() {
  const fit = $('#bfit'); if (!fit) return;
  const aw = fit.parentElement.clientWidth - 72, ah = innerHeight - (fit.getBoundingClientRect().top + scrollY) - 24;
  const sc = Math.min(1, aw / 1200, ah / 780);
  $('#bk').style.transform = `scale(${sc})`; fit.style.width = 1200 * sc + 'px'; fit.style.height = 780 * sc + 'px';
}
function bookInit() {
  bookFit(); bookGo(0);
  $('#bprev').onclick = () => bookGo(BK.cur - 1); $('#bnext').onclick = () => bookGo(BK.cur + 1);
  $('#bjump').onchange = e => { if (e.target.value !== '') bookPage(+e.target.value); e.target.value = ''; };
  document.querySelectorAll('.l6 .pg').forEach(pg => pg.onclick = e => {
    const a = e.target.closest('[data-page]'); if (a) { e.stopPropagation(); bookPage(+a.dataset.page); return; }
    bookGo(BK.cur + (+pg.dataset.dir));
  });
}
window.addEventListener('resize', bookFit);

// ---- boot
let D, cur = 0;
async function init() {
  const get = async u => (await fetch(API + u)).json();
  const [gurus, cat, sum] = await Promise.all([get('/api/gurus'), get('/api/guru/connors/strategies'), get('/api/guru/connors/summary?ticker=NIFTY%2050')]);
  const byId = Object.fromEntries(sum.map(r => [r.id, r]));
  const fams = [], seen = {};
  for (const c of cat.filter(c => c.status === 'live')) {
    const r = byId[c.id]; if (!r?.stats) continue;
    const f = seen[c.family] || (seen[c.family] = fams[fams.push({ id: c.family, name: c.family_name, session: c.session, n: 0, best: null, variants: [] }) - 1]);
    f.n++; f.variants.push({ c, s: r.stats }); if (!f.best || r.stats.sharpe > f.best.s.sharpe) f.best = { c, s: r.stats, spark: r.spark };
  }
  fams.forEach(f => { f.s = f.best.s; });
  const all = cat.filter(c => byId[c.id]?.stats?.trades).map(c => ({ c, s: byId[c.id].stats, spark: byId[c.id].spark }));
  const best = all.filter(r => r.s.trades >= 30).sort((a, b) => b.s.sharpe - a.s.sharpe)[0];
  const blocked = [], bseen = {};
  for (const c of cat.filter(c => c.status !== 'live')) { if (bseen[c.family]) continue; bseen[c.family] = 1; blocked.push({ name: c.family_name, why: c.status_note, notes: c.notes }); }
  D = { g: gurus[0], fams, best, blocked, live: sum.filter(r => r.stats).length, sig: all.filter(r => r.s.t_stat >= 2).length };
  $('#pick').innerHTML = OPTS.map((o, k) => `<button data-k="${k}">${o.name}</button>`).join('');
  $('#pick').querySelectorAll('button').forEach(b => b.onclick = () => show(+b.dataset.k));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key >= '1' && e.key <= '6') return show(+e.key - 1);
    if (OPTS[cur].render === l6 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return bookGo(BK.cur + (e.key === 'ArrowRight' ? 1 : -1));
    if (e.key === 'ArrowRight') show((cur + 1) % OPTS.length); if (e.key === 'ArrowLeft') show((cur + OPTS.length - 1) % OPTS.length);
  });
  window.addEventListener('hashchange', () => { const k = +location.hash.slice(1) - 1; if (k !== cur && k >= 0 && k < OPTS.length) show(k); });
  show(+(location.hash.slice(1) || 1) - 1);
}
// options 1-5 are mock-ups; the working versions with full stats are library-app.html skins
const FULL = ['shelf', 'hard', 'open', 'cards', 'steel'].map(sk => `library-app.html?skin=${sk}#/connors`);
document.addEventListener('click', e => {
  if (!FULL[cur] || !e.target.closest('.opt') || e.target.closest('a, button, select, input')) return;
  if (e.target.closest('.others, .btnturn, .turn')) return; // preview legends / page-turn control
  const item = e.target.closest('.book3d, .hard, .toc .ch, .card, .detail, .kpis, .portrait, .pic, .strip');
  if (item && /not converted/i.test(item.textContent)) return; // preview legends have no data yet
  if (item) location.href = FULL[cur];
});
function show(k) {
  cur = k; history.replaceState(null, '', '#' + (k + 1));
  document.querySelectorAll('#pick button').forEach(b => b.classList.toggle('on', +b.dataset.k === k));
  $('#desc').innerHTML = `<b>${OPTS[k].name}.</b> ${OPTS[k].desc}` + (FULL[k] ? ` <a class="full" href="${FULL[k]}">Open Larry Connors with full stats →</a>` : '');
  $('#stage').innerHTML = OPTS[k].render(D);
  OPTS[k].after?.();
}
init().catch(e => { $('#stage').innerHTML = `<p style="padding:40px">Could not reach the Rust API at ${API}: ${esc(e.message)}</p>`; });
</script>
</body>
