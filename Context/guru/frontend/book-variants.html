<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book variants · Strategy Vault</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/fonts-options.css">
<link rel="stylesheet" href="vendor/fonts-hand.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; background: #fff; color: #1d2330; }
:root { --foil: #e8d39a; --gold: #8a6a2f; --paper: #fdfcf9; }
.pos { color: #2f6b4a; } .neg { color: #b43a34; }
.picker { position: sticky; top: 0; z-index: 50; background: #ffffffee; backdrop-filter: blur(10px); border-bottom: 1px solid #e3e6ec; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.picker h1 { font: 600 15px/1 "IBM Plex Sans"; margin: 0; }
.picker nav { display: flex; gap: 6px; flex-wrap: wrap; }
.picker button { border: 1px solid #dfe3ea; background: #fff; border-radius: 99px; padding: 6px 13px; font: 500 13px "IBM Plex Sans"; cursor: pointer; }
.picker button.on { background: #111; color: #fff; border-color: #111; }
.picker .desc { flex-basis: 100%; font-size: 13px; color: #555; margin: 0; }
.picker .desc b { color: #111; } .picker .desc a { color: #555; }
.opt { position: relative; min-height: calc(100vh - 100px); overflow: hidden; isolation: isolate; padding: 34px 36px 70px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h2.t { font: 600 40px/1.05 "Newsreader", serif; margin: 0 0 6px; letter-spacing: -.01em; }
p.s { margin: 0 0 26px; color: #5b6272; font-size: 15px; max-width: 70ch; }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1.5px solid currentColor; }
.kv div { padding: 8px 10px 6px 0; } .kv div + div { padding-left: 10px; border-left: 1px solid #0000001a; }
.kv span { display: block; font: 11px "IBM Plex Sans"; opacity: .7; } .kv b { font: 600 22px "Newsreader", serif; }
@media (prefers-reduced-motion: reduce) { .opt *, .opt *::before, .opt *::after { transition-duration: .01s !important; animation: none !important; } }

/* ---------------- 1. REAL PAGE CURL (StPageFlip) */
.v1 { background: radial-gradient(1200px 700px at 50% 25%, #f3f1ec, #d6d3cb); }
.v1 .stage { display: flex; justify-content: center; margin-top: 8px; }
.v1 #flip { box-shadow: 0 30px 50px #0000002e; }
.v1 .page { background: var(--paper); padding: 34px 34px 40px; overflow: hidden; color: #222; font-family: "Newsreader", serif; }
.v1 .page.hard { background: #1f3a5f; color: var(--foil); }
.v1 .page .in { height: 100%; display: flex; flex-direction: column; }
.v1 .page.hard .in { border: 1.5px solid #e8d39a88; padding: 26px 22px; align-items: center; text-align: center; justify-content: center; gap: 14px; }
.v1 .page.hard .ph { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 3px solid var(--foil); } .v1 .page.hard img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(.2); }
.v1 .page h3 { font: 600 28px/1.05 "Newsreader"; margin: 0 0 8px; } .v1 .page.hard h3 { font-size: 40px; }
.v1 .page .k { font: 600 11px "IBM Plex Sans"; color: var(--gold); margin-bottom: 6px; }
.v1 .page p { font-size: 14px; line-height: 1.55; margin: 0 0 10px; color: #333; }
.v1 .page .folio { margin-top: auto; font: 11px "IBM Plex Sans"; color: #999; text-align: center; }
.v1 .page .r { font-size: 13px; line-height: 1.4; margin: 2px 0; } .v1 .page .r.o { font-weight: 600; }
.v1 .page .lbl { font: 700 10px "IBM Plex Sans"; color: #555; margin-top: 8px; }
.v1 .toc div { display: flex; gap: 6px; font-size: 14px; padding: 3px 0; } .v1 .toc i { flex: 1; border-bottom: 1px dotted #aaa; transform: translateY(-4px); } .v1 .toc b { font: 12px "IBM Plex Mono"; font-weight: 400; }
.v1 .ctrl { display: flex; justify-content: center; gap: 14px; align-items: center; margin-top: 20px; font: 13px "IBM Plex Sans"; }
.v1 .ctrl button { border: 1px solid #222; background: #fff; padding: 7px 14px; font: 600 13px "IBM Plex Sans"; cursor: pointer; }

/* ---------------- 2. BOOK SHOWCASE (cover swings open) */
.v2 { background: #f1f2f4; }
.v2 .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 40px 28px; }
.v2 .bk { position: relative; height: 290px; perspective: 1500px; cursor: pointer; }
.v2 .inside { position: absolute; inset: 0; background: var(--paper); border-radius: 2px 6px 6px 2px; padding: 16px 16px 14px; box-shadow: 6px 10px 22px #0002, inset 3px 0 6px #0000001a; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
.v2 .inside h4 { margin: 0; font: 600 17px/1.15 "Newsreader", serif; }
.v2 .inside .row { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; padding: 3px 0; } .v2 .inside .row b { font-family: "IBM Plex Mono"; font-weight: 500; }
.v2 .inside .stamp { align-self: flex-start; margin-top: auto; transform: rotate(-6deg); border: 2px solid currentColor; padding: 1px 7px; font: 700 10px "IBM Plex Mono"; }
.v2 .cover { position: absolute; inset: 0; background: var(--c); color: var(--foil); border-radius: 2px 6px 6px 2px; transform-origin: left center; transition: transform .9s cubic-bezier(.2,.8,.2,1); padding: 22px 18px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 8px 0 10px -6px #0007, 8px 12px 24px #0003; backface-visibility: hidden; z-index: 2; }
.v2 .cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid #e8d39a77; pointer-events: none; }
.v2 .cover h4 { margin: 0; font: 600 22px/1.05 "Newsreader", serif; } .v2 .cover small { font-size: 11px; opacity: .85; }
.v2 .bk:hover .cover, .v2 .bk:focus .cover { transform: rotateY(-155deg); }
.v2 .no { font: 600 11px "IBM Plex Mono"; opacity: .8; }

/* ---------------- 3. COVERFLOW */
.v3 { background: linear-gradient(180deg, #f6f6f8, #e4e5ea); }
.v3 .flow { position: relative; height: 380px; perspective: 1100px; margin-top: 10px; }
.v3 .it { position: absolute; left: 50%; top: 20px; width: 230px; height: 320px; margin-left: -115px; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .7s; cursor: pointer; transform-style: preserve-3d; }
.v3 .it .f { position: absolute; inset: 0; background: var(--c); color: var(--foil); border-radius: 3px 8px 8px 3px; padding: 22px 18px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 8px 0 10px -6px #0007; -webkit-box-reflect: below 6px linear-gradient(transparent 70%, #ffffff40); }
.v3 .it .f::before { content: ""; position: absolute; inset: 10px; border: 1px solid #e8d39a66; }
.v3 .it h4 { margin: 0; font: 600 25px/1.05 "Newsreader", serif; } .v3 .it small { font-size: 12px; opacity: .85; }
.v3 .it .big { font: 600 40px "Newsreader", serif; }
.v3 .nav3 { display: flex; justify-content: center; gap: 12px; margin: 40px 0 18px; } .v3 .nav3 button { border: 1px solid #222; background: #fff; padding: 7px 16px; font: 600 13px "IBM Plex Sans"; cursor: pointer; }
.v3 .detail { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 10px 30px #0000000f; }
.v3 .detail h3 { margin: 0 0 4px; font: 600 26px "Newsreader", serif; } .v3 .detail p { margin: 0 0 12px; color: #5b6272; }

/* ---------------- 4. THUMB INDEX */
.v4 { background: #e9e7e1; }
.v4 .book { position: relative; display: grid; grid-template-columns: 1fr 1fr; max-width: 1120px; margin: 0 auto; min-height: 600px; filter: drop-shadow(0 24px 34px #0000002a); }
.v4 .pg { background: var(--paper); padding: 44px 48px; position: relative; }
.v4 .pg.l { border-radius: 8px 0 0 8px; background: linear-gradient(90deg, var(--paper) 88%, #ece8df); }
.v4 .pg.r { border-radius: 0 8px 8px 0; background: linear-gradient(270deg, var(--paper) 92%, #ece8df); padding-right: 60px; }
.v4 .tabs { position: absolute; right: -78px; top: 40px; display: flex; flex-direction: column; gap: 6px; }
.v4 .tab { width: 108px; padding: 10px 8px 10px 22px; border-radius: 0 10px 10px 0; background: var(--c); color: #fff; font: 700 11px/1.15 "IBM Plex Sans"; cursor: pointer; box-shadow: 3px 3px 8px #0002; transition: transform .25s; writing-mode: horizontal-tb; }
.v4 .tab:hover, .v4 .tab.on { transform: translateX(10px); }
.v4 .tab.on { box-shadow: 3px 3px 8px #0003, inset 4px 0 0 #fff6; }
.v4 h3 { font: 600 34px/1.05 "Newsreader", serif; margin: 0 0 6px; } .v4 .k { font: 600 11px "IBM Plex Sans"; color: var(--gold); }
.v4 .fam { padding: 12px 0; border-bottom: 1px dotted #c9c3b4; } .v4 .fam b { font: 600 18px "Newsreader", serif; display: block; }
.v4 .fam span { font-size: 12.5px; color: #555; }
.v4 .bars .b { display: grid; grid-template-columns: 170px 1fr 50px; gap: 10px; align-items: center; font-size: 12.5px; margin: 8px 0; }
.v4 .bars .b i { display: block; height: 12px; background: var(--c); border-radius: 0 3px 3px 0; }

/* ---------------- 5. STACK OF BOOKS */
.v5 { background: radial-gradient(900px 500px at 30% 0%, #fff7e8, transparent 70%), #f1f2f4; }
.v5 .stack { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 0; max-width: 980px; margin: 10px auto 0; padding-left: 40px; }
.v5 .hb { position: relative; height: 46px; width: var(--w); margin-left: var(--x); background: var(--c); color: var(--foil); border-radius: 3px; display: flex; align-items: center; gap: 14px; padding: 0 16px; cursor: pointer; transition: transform .45s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 3px 0 #ffffff24, inset 0 -4px 0 #0000002e, 0 2px 0 #00000026; }
.v5 .hb::before, .v5 .hb::after { content: ""; position: absolute; top: 6px; bottom: 6px; width: 2px; border-left: 1px solid #e8d39a99; border-right: 1px solid #e8d39a99; } .v5 .hb::before { left: 10px; } .v5 .hb::after { right: 10px; }
.v5 .hb .n { font: 600 16px "Newsreader", serif; white-space: nowrap; } .v5 .hb .m { font: 11px "IBM Plex Mono"; opacity: .9; margin-left: auto; white-space: nowrap; }
.v5 .hb:hover { transform: translateX(46px); z-index: 2; }
.v5 .floor { height: 14px; max-width: 1060px; margin: 0 auto; background: linear-gradient(180deg, #caa972, #a98652); border-radius: 2px; }

/* ---------------- 6. TRADE JOURNAL (notebook) */
.v6 { background: #e4e1da; }
.v6 .nb { position: relative; max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; background: #2b2b2b; padding: 10px; border-radius: 14px; box-shadow: 0 24px 40px #00000040; }
.v6 .band { position: absolute; top: -6px; bottom: -6px; right: 22px; width: 14px; background: #1a1a1a; border-radius: 4px; box-shadow: inset 2px 0 0 #444; z-index: 3; }
.v6 .lp { background: #fbf9f3; min-height: 620px; padding: 40px 36px 30px 64px; position: relative; font-family: "Caveat", cursive; font-size: 23px; line-height: 32px; color: #24324d;
  background-image: linear-gradient(90deg, transparent 50px, #e6a0a0 50px 51.5px, transparent 51.5px), repeating-linear-gradient(transparent 0 31px, #b9cbe0 31px 32px); background-position: 0 0, 0 8px; }
.v6 .lp.l { border-radius: 8px 0 0 8px; box-shadow: inset -14px 0 18px -14px #0004; } .v6 .lp.r { border-radius: 0 8px 8px 0; box-shadow: inset 14px 0 18px -14px #0004; padding-right: 46px; }
.v6 .lp h3 { font: 700 34px/32px "Caveat"; margin: 0 0 0; } .v6 .lp .ln { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v6 .lp .win { color: #2f6b4a; } .v6 .lp .loss { color: #b43a34; }
.v6 .circle { border: 2px solid #2f6b4a; border-radius: 50% 45% 50% 48%; padding: 0 5px; }
.v6 .sticky { position: absolute; right: 30px; bottom: 44px; width: 170px; padding: 12px 14px; background: #fff1a8; transform: rotate(3deg); box-shadow: 2px 6px 12px #0002; font: 600 21px/1.15 "Caveat"; color: #3a3a2a; }

/* ---------------- 7. ACCOUNTING LEDGER */
.v7 { background: #dfe3dc; }
.v7 .lg { max-width: 1160px; margin: 0 auto; background: #f6faf2; border: 1px solid #b9cdb4; box-shadow: 0 18px 34px #0000001f; padding: 26px 26px 18px; font-family: "IBM Plex Mono", monospace; }
.v7 .lg h3 { font: 600 26px "Newsreader", serif; margin: 0; color: #1d3a2a; } .v7 .lg .sub { font: 12px "IBM Plex Sans"; color: #5c7262; margin-bottom: 14px; }
.v7 table { width: 100%; border-collapse: collapse; font-size: 13px; }
.v7 th { font: 600 11px "IBM Plex Sans"; color: #2f5a3d; text-align: left; padding: 6px 8px; border-bottom: 2px solid #2f5a3d; border-top: 2px solid #2f5a3d; }
.v7 td { padding: 6px 8px; border-bottom: 1px solid #b9dcc4; } .v7 td + td, .v7 th + th { border-left: 1px solid #e3a3a3; }
.v7 td.n, .v7 th.n { text-align: right; } .v7 tr:nth-child(even) td { background: #eef6ea; }
.v7 .red { color: #b43a34; } .v7 tfoot td { border-top: 2px double #2f5a3d; font-weight: 600; }

/* ---------------- 8. RIBBON BOOKMARKS */
.v8 { background: radial-gradient(1000px 600px at 50% 10%, #f8f7f3, #dcdad3); }
.v8 .holder { position: relative; width: 860px; max-width: 100%; height: 560px; margin: 0 auto; perspective: 2000px; }
.v8 .inner { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; background: var(--paper); border-radius: 0 8px 8px 0; padding: 40px 40px; box-shadow: 0 20px 40px #0003; overflow: hidden; }
.v8 .cov { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; transform-origin: left center; transition: transform 1.1s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; z-index: 3; }
.v8 .cov .fa, .v8 .cov .ba { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 0 8px 8px 0; }
.v8 .cov .fa { background: #1f3a5f; color: var(--foil); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; box-shadow: inset 10px 0 18px -8px #0008; }
.v8 .cov .fa .ph { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; border: 3px solid var(--foil); } .v8 .cov .fa img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(.2); }
.v8 .cov .fa h3 { margin: 0; font: 600 38px "Newsreader", serif; } .v8 .cov .fa small { font-size: 13px; opacity: .85; }
.v8 .cov .ba { transform: rotateY(180deg); border-radius: 8px 0 0 8px; background: linear-gradient(90deg, var(--paper) 88%, #ece8df); padding: 40px; }
.v8.open .cov { transform: rotateY(-180deg); }
.v8 .ribbons { position: absolute; left: 50%; top: 100%; width: 50%; display: flex; gap: 9px; padding-left: 26px; z-index: 4; }
.v8 .rb { width: 22px; height: var(--h); background: var(--c); cursor: pointer; transition: height .35s, transform .35s; position: relative; box-shadow: inset -3px 0 0 #0002; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 9px), 0 100%); }
.v8 .rb:hover, .v8 .rb.on { height: calc(var(--h) + 34px); }
.v8 .rb span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl; font: 600 10px "IBM Plex Sans"; color: #fff; white-space: nowrap; }
.v8 h3.p { font: 600 30px/1.05 "Newsreader", serif; margin: 0 0 6px; } .v8 .k { font: 600 11px "IBM Plex Sans"; color: var(--gold); }
.v8 .rl { font-size: 13px; margin: 3px 0; } .v8 .rl.o { font-weight: 600; } .v8 .lbl { font: 700 10px "IBM Plex Sans"; color: #555; margin-top: 10px; }
.v8 .hint8 { text-align: center; margin-top: 150px; color: #5b6272; font-size: 13px; }

@media (max-width: 1000px) { .v4 .book, .v6 .nb { grid-template-columns: 1fr; } .v4 .tabs { position: static; flex-direction: row; flex-wrap: wrap; } .kv { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="picker">
  <h1>Book variants</h1>
  <nav id="pick"></nav>
  <p class="desc" id="desc"></p>
</header>
<main id="stage"></main>

<script src="vendor/page-flip.browser.js"></script>
<script>
const API = new URLSearchParams(location.search).get('api') || `http://${location.hostname || 'localhost'}:8090`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 1, s = false) => v == null ? '–' : (s && v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const fx = (v, d = 2) => v == null ? '–' : v.toFixed(d);
const cls = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const PHOTO = 'img/gurus/connors.jpg';
const CLOTH = ['#1f3a5f', '#7a2e2e', '#2f5140', '#8a6a2f', '#4a5563', '#5b3b5e', '#2d4f5c', '#6b3f2a'];
const stampOf = s => s.trades < 30 ? ['THIN DATA', '#b43a34'] : s.t_stat >= 2 ? ['SIGNIFICANT', '#2f6b4a'] : ['NO EDGE', '#7d8594'];
function spark(v, w, h, col) {
  if (!v || v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), n = v.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;max-width:100%"><path d="${v.map((x, i) => `${i ? 'L' : 'M'}${(1 + i / (n - 1) * (w - 2)).toFixed(1)},${(h - 1 - (x - lo) / ((hi - lo) || 1) * (h - 2)).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="1.8"/></svg>`;
}
function rules(c, cl = 'r', lab = 'lbl') {
  const sec = { F: [], E: [], A: [], X: [] };
  for (const r of c.rules) { const [t, ...x] = r.split('|'); (sec[t] || sec.E).push(x.join('|')); }
  const o = r => /^(Buy|Short|Sell|Cover|Next day|No other signal|Once|After|Stop)/.test(r);
  const b = (t, it) => it.length ? `<div class="${lab}">${t}</div>${it.map(r => `<div class="${cl} ${o(r) ? 'o' : ''}">${o(r) ? '→ ' : '· '}${esc(r)}</div>`).join('')}` : '';
  return b('CONDITIONS', sec.F) + b('ENTRY', sec.E) + b('SCALE-IN', sec.A) + b('EXIT', sec.X);
}
const kv = s => `<div class="kv"><div><span>CAGR</span><b class="${cls(s.cagr)}">${pct(s.cagr, 2, true)}</b></div><div><span>Sharpe</span><b>${fx(s.sharpe)}</b></div><div><span>Max DD</span><b class="neg">${pct(s.max_dd, 1)}</b></div><div><span>Win · trades</span><b>${pct(s.win_rate, 0)} · ${fx(s.trades, 0)}</b></div></div>`;

const V = [
  { name: '1. Real Page Curl', render: v1, after: v1after, desc: 'The whole course as a book with real page physics: drag a corner and the page curls, or click its edge. Built on <a href="https://github.com/Nodlik/StPageFlip" target="_blank">StPageFlip</a> (MIT, the vanilla successor of turn.js), saved in the project.' },
  { name: '2. Book Showcase', render: v2, desc: 'All 14 strategies as books on a table. Hover a book and its cover swings open to show the stats printed inside. After <a href="https://github.com/codrops/BookPreview" target="_blank">codrops/BookPreview</a> and Card-Hover-Book-Effects.' },
  { name: '3. Coverflow', render: v3, after: v3after, desc: 'Strategy books in a 3D carousel with mirror reflections; click a book or use the arrows, and the centred book\'s rules and numbers appear below. After <a href="https://github.com/vanderlee/coverflow" target="_blank">vanderlee/coverflow</a>.' },
  { name: '4. Thumb Index', render: v4, after: v4after, desc: 'A reference book with coloured thumb-index tabs cut into its edge, one per strategy group (like a dictionary). Click a tab to open that section.' },
  { name: '5. Stack of Books', render: v5, desc: 'The strategies as a pile of books lying on their sides, widest at the bottom. Hover a spine and it slides out so you can read its numbers.' },
  { name: '6. Trade Journal', render: v6, desc: 'A notebook with an elastic band: the latest TPS 2-3-5 Long trades written in by hand on lined paper, wins circled. Real trades from the API.' },
  { name: '7. Accounting Ledger', render: v7, desc: 'A green-ruled ledger of real TPS trades on ₹1,00,000: debit (capital deployed), credit (P&L), running balance, losses in red ink.' },
  { name: '8. Ribbon Bookmarks', render: v8, after: v8after, desc: 'A closed book with one satin ribbon per strategy hanging out of it. Pull a ribbon and the cover opens at that strategy\'s page.' },
];

// ------------------------------------------------ 1
let PF = null;
function v1(D) {
  const pages = [];
  pages.push(`<div class="page hard"><div class="in"><div class="ph"><img src="${PHOTO}" alt=""></div><h3>${esc(D.g.name)}</h3><div>Swing Trading College IX</div><small>${D.fams.length} strategies tested on Nifty 50</small></div></div>`);
  pages.push(`<div class="page"><div class="in"><div class="k">The thesis</div><h3>${esc(D.g.tagline)}</h3>${D.g.thesis.slice(0, 3).map(t => `<p><b>${esc(t.title)}.</b> ${esc(t.body)}</p>`).join('')}<div class="folio">i</div></div></div>`);
  pages.push(`<div class="page"><div class="in"><div class="k">Contents</div><h3>${D.fams.length} strategies</h3><div class="toc">${D.fams.map((f, i) => `<div><span>${esc(f.name)}</span><i></i><b>${i + 3}</b></div>`).join('')}</div><div class="folio">ii</div></div></div>`);
  D.fams.forEach((f, i) => {
    const c = f.best.c, s = f.s, [st, sc] = stampOf(s);
    pages.push(`<div class="page"><div class="in"><div class="k">Chapter ${i + 1} · Session ${c.session}${f.n > 1 ? ` · best of ${f.n} variants` : ''}</div><h3>${esc(f.name)}</h3>
      <div style="font:11px 'IBM Plex Sans';color:#777;margin-bottom:6px">${esc(c.variant || c.dir)} <span style="color:${sc};border:1.5px solid ${sc};padding:0 5px;margin-left:6px;font-weight:700">${st}</span></div>
      ${kv(s)}<div style="margin:10px 0 4px">${spark(f.best.spark, 390, 80, '#8a6a2f')}</div>${rules(c)}<div class="folio">${i + 3}</div></div></div>`);
  });
  if (pages.length % 2 === 0) pages.push(`<div class="page"><div class="in"><div class="k">Notes</div><h3>Read with care</h3><p>Every rule is transcribed from the course and computed in Rust on Nifty 50, 2000–2026, at zero cost. Stamps: SIGNIFICANT (t ≥ 2), NO EDGE, THIN DATA (&lt; 30 trades).</p><div class="folio">${pages.length}</div></div></div>`);
  pages.push(`<div class="page hard"><div class="in"><h3 style="font-size:26px;font-style:italic">“${esc(D.g.tagline)}”</h3><small>The Strategy Vault</small></div></div>`);
  return `<section class="opt v1"><div class="wrap"><h2 class="t">Real Page Curl</h2><p class="s">Drag any page corner, or click near a page edge. The covers are stiff ("hard") like a real hardback.</p>
    <div class="stage"><div id="flip">${pages.join('')}</div></div>
    <div class="ctrl"><button id="fp">← Previous</button><span id="fpos"></span><button id="fn">Next →</button></div></div></section>`;
}
function v1after() {
  PF = new St.PageFlip($('#flip'), { width: 470, height: 640, size: 'stretch', minWidth: 300, maxWidth: 560, minHeight: 400, maxHeight: 760, showCover: true, maxShadowOpacity: .45, mobileScrollSupport: false, flippingTime: 900 });
  PF.loadFromHTML(document.querySelectorAll('#flip .page'));
  const upd = () => { $('#fpos').textContent = `Page ${PF.getCurrentPageIndex() + 1} of ${PF.getPageCount()}`; };
  PF.on('flip', upd); upd();
  $('#fp').onclick = () => PF.flipPrev(); $('#fn').onclick = () => PF.flipNext();
}

// ------------------------------------------------ 2
function v2(D) {
  return `<section class="opt v2"><div class="wrap"><h2 class="t">Book Showcase</h2><p class="s">Hover (or tab to) a book to open its cover.</p><div class="grid">${D.fams.map((f, i) => {
    const s = f.s, [st, sc] = stampOf(s);
    return `<div class="bk" tabindex="0"><div class="inside"><h4>${esc(f.name)}</h4><div style="font-size:11px;color:#777">${esc(f.best.c.variant || f.best.c.dir)} · Session ${f.session}</div>
      <div class="row"><span>CAGR</span><b class="${cls(s.cagr)}">${pct(s.cagr, 2, true)}</b></div><div class="row"><span>Sharpe</span><b>${fx(s.sharpe)}</b></div><div class="row"><span>Max DD</span><b class="neg">${pct(s.max_dd, 1)}</b></div><div class="row"><span>Win rate</span><b>${pct(s.win_rate, 0)}</b></div><div class="row"><span>Trades</span><b>${fx(s.trades, 0)}</b></div>
      ${spark(f.best.spark, 176, 34, '#8a6a2f')}<span class="stamp" style="color:${sc}">${st}</span></div>
      <div class="cover" style="--c:${CLOTH[i % CLOTH.length]}"><span class="no">No. ${String(i + 1).padStart(2, '0')}</span><div><h4>${esc(f.name)}</h4><small>Larry Connors · Session ${f.session}</small></div></div></div>`;
  }).join('')}</div></div></section>`;
}

// ------------------------------------------------ 3
let CF = 0;
function v3(D) {
  return `<section class="opt v3"><div class="wrap"><h2 class="t">Coverflow</h2><p class="s">Click a book, or use the arrows below.</p>
    <div class="flow" id="flow">${D.fams.map((f, i) => `<div class="it" data-i="${i}"><div class="f" style="--c:${CLOTH[i % CLOTH.length]}"><small>Chapter ${i + 1} · Session ${f.session}</small><div><div class="big ${''}">${fx(f.s.sharpe)}</div><small>Sharpe on Nifty 50</small></div><h4>${esc(f.name)}</h4></div></div>`).join('')}</div>
    <div class="nav3"><button id="cfp">← Previous</button><button id="cfn">Next →</button></div><div class="detail" id="cfd"></div></div></section>`;
}
function v3after() {
  const items = [...document.querySelectorAll('.v3 .it')];
  const go = k => {
    CF = Math.max(0, Math.min(items.length - 1, k));
    items.forEach((el, i) => {
      const d = i - CF, a = Math.abs(d);
      el.style.transform = d === 0 ? 'translateZ(80px)' : `translateX(${d * 120 + Math.sign(d) * 70}px) rotateY(${-Math.sign(d) * 58}deg) translateZ(${-a * 30}px)`;
      el.style.zIndex = 100 - a; el.style.opacity = a > 5 ? 0 : 1;
    });
    const f = D.fams[CF];
    $('#cfd').innerHTML = `<h3>${esc(f.name)}</h3><p>${esc(f.best.c.variant || f.best.c.dir)}${f.n > 1 ? ` · best of ${f.n} variants` : ''} · ${esc(f.best.c.group)}</p>${kv(f.s)}<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:14px"><div style="font-size:13px;line-height:1.5">${rules(f.best.c, 'rl', 'lbl')}</div><div>${spark(f.best.spark, 340, 150, '#1f3a5f')}</div></div>`;
    $('#cfd').querySelectorAll('.lbl').forEach(e => e.style.cssText = 'font:700 10px IBM Plex Sans;color:#555;margin-top:8px');
  };
  items.forEach(el => el.onclick = () => go(+el.dataset.i));
  $('#cfp').onclick = () => go(CF - 1); $('#cfn').onclick = () => go(CF + 1);
  go(CF);
}

// ------------------------------------------------ 4
function groupsOf(D) {
  const g = []; const by = {};
  D.fams.forEach(f => { const k = f.best.c.group.split(' · ')[0]; if (!by[k]) g.push(by[k] = { name: k, fams: [] }); by[k].fams.push(f); });
  return g;
}
function v4(D) {
  const G = groupsOf(D);
  return `<section class="opt v4"><div class="wrap"><h2 class="t">Thumb Index</h2><p class="s">Click a coloured tab on the right edge of the book.</p>
    <div class="book"><div class="pg l" id="ti-l"></div><div class="pg r" id="ti-r"></div>
    <div class="tabs">${G.map((g, i) => `<div class="tab" data-i="${i}" style="--c:${CLOTH[i % CLOTH.length]}">${esc(g.name)}</div>`).join('')}</div></div></div></section>`;
}
function v4after() {
  const G = groupsOf(D);
  const open = i => {
    const g = G[i], col = CLOTH[i % CLOTH.length], mx = Math.max(...D.fams.map(f => f.s.sharpe), .01);
    document.querySelectorAll('.v4 .tab').forEach(t => t.classList.toggle('on', +t.dataset.i === i));
    $('#ti-l').innerHTML = `<div class="k">Section ${i + 1} of ${G.length}</div><h3>${esc(g.name)}</h3><p style="color:#555">${g.fams.length} ${g.fams.length > 1 ? 'strategies' : 'strategy'} in this section. Bars show Sharpe on Nifty 50 (best variant).</p>
      <div class="bars" style="--c:${col}">${g.fams.map(f => `<div class="b"><span>${esc(f.name)}</span><i style="width:${Math.max(2, f.s.sharpe / mx * 100)}%"></i><b style="font:12px IBM Plex Mono">${fx(f.s.sharpe)}</b></div>`).join('')}</div>
      <div style="margin-top:24px">${spark(g.fams[0].best.spark, 460, 120, col)}<div style="font:11px IBM Plex Sans;color:#888">Growth of ₹1 · ${esc(g.fams[0].name)}</div></div>`;
    $('#ti-r').innerHTML = g.fams.map(f => `<div class="fam"><b>${esc(f.name)}</b><span>${esc(f.best.c.variant || f.best.c.dir)} · Session ${f.session}${f.n > 1 ? ` · ${f.n} variants` : ''}</span>${kv(f.s)}</div>`).join('');
  };
  document.querySelectorAll('.v4 .tab').forEach(t => t.onclick = () => open(+t.dataset.i));
  open(0);
}

// ------------------------------------------------ 5
function v5(D) {
  const sorted = [...D.fams].sort((a, b) => b.s.trades - a.s.trades);
  return `<section class="opt v5"><div class="wrap"><h2 class="t">Stack of Books</h2><p class="s">Ordered by number of trades: the most-traded strategy is the widest book at the bottom. Hover a spine.</p>
    <div class="stack">${sorted.map((f, i) => `<div class="hb" style="--c:${CLOTH[i % CLOTH.length]};--w:${560 + (sorted.length - i) * 22}px;--x:${(i * 37) % 60}px"><span class="n">${esc(f.name)}</span><span class="m">CAGR ${pct(f.s.cagr, 1, true)} · Sharpe ${fx(f.s.sharpe)} · ${fx(f.s.trades, 0)} trades</span></div>`).join('')}</div>
    <div class="floor"></div></div></section>`;
}

// ------------------------------------------------ 6
function v6(D) {
  const tr = D.tps.trades.filter(t => !t.open).slice(-16).reverse();
  const s = D.tps.stats;
  const line = t => `<p class="ln">${t.entry.slice(5)} → ${t.exit.slice(5)} · ${t.legs.length} pc · <span class="${t.ret > 0 ? 'win' : 'loss'}">${t.ret > 0 ? `<span class="circle">${pct(t.ret, 2, true)}</span>` : pct(t.ret, 2, true)}</span> · ${esc(t.reason.replace('Close ≥ 1.5% below 200-day SMA', 'stop'))}</p>`;
  return `<section class="opt v6"><div class="wrap"><h2 class="t">Trade Journal</h2><p class="s">The latest closed TPS 2-3-5 Long trades on Nifty 50, newest first. Wins circled in green.</p>
    <div class="nb"><div class="band"></div>
      <div class="lp l"><h3>TPS 2-3-5 · Nifty 50</h3><p class="ln">Buy fear above the 200-day.</p><p class="ln">RSI(2) &lt; 30 → buy 20%, add 30% + 50% lower.</p><p class="ln">Out when RSI(2) &gt; 70.</p><p class="ln">&nbsp;</p>
        <p class="ln">Trades: ${fx(s.trades, 0)} · won ${pct(s.win_rate, 0)}</p><p class="ln">Avg trade: ${pct(s.avg_trade, 2, true)}</p><p class="ln">CAGR ${pct(s.cagr, 2, true)} vs B&amp;H ${pct(s.bh_cagr, 1, true)}</p><p class="ln">Worst drawdown ${pct(s.max_dd, 1)}</p>
        <p class="ln">&nbsp;</p><p class="ln" style="color:#b43a34">Note: t = ${fx(s.t_stat)} → not significant!</p>
        <div class="sticky">Win rate is high (${pct(s.win_rate, 0)}) but the losers are ${fx(Math.abs(s.avg_loss / s.avg_win), 1)}× bigger than the winners.</div></div>
      <div class="lp r">${tr.slice(0, 16).map(line).join('')}</div></div></div></section>`;
}

// ------------------------------------------------ 7
function v7(D) {
  const base = 100000; let bal = base;
  const all = D.tps.trades.filter(t => !t.open);
  const rows = all.map(t => { const deployed = bal * t.legs.reduce((a, l) => a + l[2], 0), pnl = bal * t.ret; bal += pnl; return { t, deployed, pnl, bal }; });
  const last = rows.slice(-18);
  const tot = rows.reduce((a, r) => a + r.pnl, 0);
  const inr = v => v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
  return `<section class="opt v7"><div class="wrap"><h2 class="t">Accounting Ledger</h2><p class="s">₹1,00,000 compounded through every TPS 2-3-5 Long trade, from the first one in ${all[0].entry}; the last 18 entries shown.</p>
    <div class="lg"><h3>Ledger · TPS 2-3-5 Long · Nifty 50</h3><div class="sub">Folio 1 · opening balance ₹1,00,000 on ${all[0].entry} · ${all.length} entries</div>
    <table><thead><tr><th>Date</th><th>Particulars</th><th class="n">Pieces</th><th class="n">Dr. capital deployed</th><th class="n">Cr. profit / (loss)</th><th class="n">Balance</th></tr></thead><tbody>
    ${last.map(r => `<tr><td>${r.t.exit}</td><td>Bought ${r.t.entry}, ${esc(r.t.reason)}</td><td class="n">${r.t.legs.length}</td><td class="n">${inr(r.deployed)}</td><td class="n ${r.pnl < 0 ? 'red' : ''}">${r.pnl < 0 ? `(${inr(-r.pnl)})` : inr(r.pnl)}</td><td class="n">${inr(r.bal)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="4">Total over ${all.length} trades</td><td class="n ${tot < 0 ? 'red' : ''}">${inr(tot)}</td><td class="n">${inr(bal)}</td></tr></tfoot></table></div></div></section>`;
}

// ------------------------------------------------ 8
function v8(D) {
  return `<section class="opt v8"><div class="wrap"><h2 class="t">Ribbon Bookmarks</h2><p class="s">Pull a ribbon (click it). Click the open page to close the book.</p>
    <div class="holder"><div class="inner" id="rb-r"></div><div class="cov"><div class="fa"><div class="ph"><img src="${PHOTO}" alt=""></div><h3>${esc(D.g.name)}</h3><small>Swing Trading College IX · ${D.fams.length} ribbons</small></div><div class="ba" id="rb-l"></div></div>
    <div class="ribbons">${D.fams.map((f, i) => `<div class="rb" data-i="${i}" style="--c:${CLOTH[i % CLOTH.length]};--h:${70 + (i * 23) % 50}px" title="${esc(f.name)}"><span>${esc(f.name.split(' (')[0])}</span></div>`).join('')}</div></div>
    <p class="hint8">${D.fams.length} ribbons, one per strategy.</p></div></section>`;
}
function v8after() {
  const sec = $('.v8');
  const open = i => {
    const f = D.fams[i], c = f.best.c;
    document.querySelectorAll('.v8 .rb').forEach(r => r.classList.toggle('on', +r.dataset.i === i));
    $('#rb-l').innerHTML = `<div class="k">Chapter ${i + 1} · Session ${c.session}</div><h3 class="p">${esc(f.name)}</h3><div style="font-size:12px;color:#777;margin-bottom:8px">${esc(c.variant || c.dir)}</div>${rules(c, 'rl', 'lbl')}`;
    $('#rb-r').innerHTML = `<div class="k">On Nifty 50</div><h3 class="p">Results</h3>${kv(f.s)}<div style="margin:14px 0">${spark(f.best.spark, 340, 140, CLOTH[i % CLOTH.length])}</div><p style="font-size:13px;color:#555">${fx(f.s.trades, 0)} trades · profit factor ${fx(f.s.profit_factor)} · t = ${fx(f.s.t_stat)} · ${pct(f.s.exposure, 0)} in market.</p>`;
    sec.classList.add('open');
  };
  document.querySelectorAll('.v8 .rb').forEach(r => r.onclick = () => open(+r.dataset.i));
  $('.v8 .holder').addEventListener('click', e => { if (e.target.closest('.inner, .ba')) sec.classList.remove('open'); });
}

// ------------------------------------------------ boot
let D, cur = 0;
async function init() {
  const get = async u => (await fetch(API + u)).json();
  const [gurus, cat, sum, tps] = await Promise.all([get('/api/gurus'), get('/api/guru/connors/strategies'), get('/api/guru/connors/summary?ticker=NIFTY%2050'), get('/api/guru/connors/run?id=tps_long&ticker=NIFTY%2050')]);
  const byId = Object.fromEntries(sum.map(r => [r.id, r]));
  const fams = [], seen = {};
  for (const c of cat.filter(c => c.status === 'live')) {
    const r = byId[c.id]; if (!r?.stats) continue;
    const f = seen[c.family] || (seen[c.family] = fams[fams.push({ id: c.family, name: c.family_name, session: c.session, n: 0, best: null }) - 1]);
    f.n++; if (!f.best || r.stats.sharpe > f.best.s.sharpe) f.best = { c, s: r.stats, spark: r.spark };
  }
  fams.forEach(f => f.s = f.best.s);
  D = { g: gurus[0], fams, tps };
  $('#pick').innerHTML = V.map((v, k) => `<button data-k="${k}">${v.name}</button>`).join('');
  $('#pick').querySelectorAll('button').forEach(b => b.onclick = () => show(+b.dataset.k));
  document.addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '8') show(+e.key - 1); });
  window.addEventListener('hashchange', () => { const k = +location.hash.slice(1) - 1; if (k !== cur && k >= 0 && k < V.length) show(k); });
  show(Math.max(0, Math.min(V.length - 1, +(location.hash.slice(1) || 1) - 1)));
}
function show(k) {
  if (PF) { try { PF.destroy(); } catch (e) {} PF = null; }
  cur = k; history.replaceState(null, '', '#' + (k + 1));
  document.querySelectorAll('#pick button').forEach(b => b.classList.toggle('on', +b.dataset.k === k));
  $('#desc').innerHTML = `<b>${V[k].name}.</b> ${V[k].desc}`;
  $('#stage').innerHTML = V[k].render(D);
  V[k].after?.();
}
init().catch(e => { $('#stage').innerHTML = `<p style="padding:40px">Could not reach the Rust API at ${API}: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
