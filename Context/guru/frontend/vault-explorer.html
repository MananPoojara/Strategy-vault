<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Explorer · Strategy Vault</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/fonts-options.css">
<style>
:root { --bg: #e9e9e9; --panel: #f6f6f6; --card: #fbfbfb; --ink: #090909; --ink2: #5f6166; --ink3: #8b8d93; --steel: #b9b9ba; --rule: #dcdcdd;
  --blue: #2f5a8f; --blue-soft: #e4ebf4; --red: #c43c3c; --green: #2e7d4f; --font: "Archivo", "IBM Plex Sans", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { background: linear-gradient(180deg, #f3f3f3, var(--bg) 520px) no-repeat, var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.num, td.n { font-variant-numeric: tabular-nums; }
.pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--ink3); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 30px; height: 58px; padding: 0 32px; background: rgb(242 242 242 / .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--steel); }
.wordmark { font-weight: 800; font-stretch: 125%; font-size: 18px; text-decoration: none; }
.cats { display: flex; gap: 22px; font-size: 14px; } .cats a { text-decoration: none; color: var(--ink2); } .cats a.on { color: var(--ink); font-weight: 700; }
.cats em { font-style: normal; font-size: 11px; margin-left: 6px; padding: 1px 7px; border: 1px solid var(--steel); color: var(--ink3); }
.status { margin-left: auto; font-size: 12px; color: var(--ink2); }

.page { max-width: 1320px; margin: 0 auto; padding: 0 32px 60px; }
.crumbs { font-size: 13px; color: var(--ink2); padding: 18px 0 0; } .crumbs a { cursor: pointer; text-decoration: none; } .crumbs a:hover { text-decoration: underline; } .crumbs b { color: var(--ink); font-weight: 600; }
.hero { display: grid; grid-template-columns: 1fr 460px; gap: 36px; align-items: center; padding: 18px 0 22px; }
.hero h1 { font-weight: 800; font-stretch: 112%; font-size: clamp(34px, 4vw, 50px); line-height: 1.02; letter-spacing: -.02em; margin: 0 0 12px; }
.hero p { margin: 0; color: var(--ink2); font-size: 15.5px; max-width: 640px; }
.tree { display: flex; flex-wrap: wrap; gap: 0; margin-top: 18px; border: 1px solid var(--steel); width: fit-content; background: var(--card); }
.tree button { border: 0; background: none; padding: 9px 16px; cursor: pointer; text-align: left; border-right: 1px solid var(--rule); }
.tree button:last-child { border-right: 0; } .tree button b { display: block; font-size: 20px; font-weight: 700; line-height: 1.1; } .tree button span { font-size: 11.5px; color: var(--ink2); }
.tree button.on { background: var(--ink); color: #fff; } .tree button.on span { color: #cfd0d3; }
.tree i { font-style: normal; color: var(--ink3); align-self: center; padding: 0 2px; }

.dist { background: var(--card); border: 1px solid var(--steel); padding: 16px 18px 12px; }
.dist .h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; } .dist .h b { font-size: 14px; } .dist .h span { font: 600 11px "IBM Plex Mono", monospace; color: var(--ink3); letter-spacing: .04em; }
.dist .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--blue); margin-top: 6px; }

.controls { border-top: 1px solid var(--steel); padding-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.lab { font-size: 11.5px; font-weight: 600; color: var(--ink2); letter-spacing: .03em; text-transform: uppercase; margin-right: 2px; }
.seg { display: inline-flex; border: 1px solid var(--steel); background: var(--card); }
.seg button { border: 0; border-right: 1px solid var(--rule); background: none; padding: 7px 13px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button:last-child { border-right: 0; } .seg button.on { background: var(--ink); color: #fff; } .seg button small { color: var(--ink3); margin-left: 4px; font-size: 11px; } .seg button.on small { color: #bbb; }
.seg button.soon { color: var(--ink3); }
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--steel); margin: 6px 0 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 0; cursor: pointer; font-size: 14.5px; color: var(--ink2); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); font-weight: 700; border-color: var(--ink); } .tabs button small { font-weight: 500; color: var(--ink3); margin-left: 5px; font-size: 11.5px; }
.tabnote { font-size: 13px; color: var(--ink2); margin: -6px 0 12px; }
.search { flex: 1 1 280px; position: relative; } .search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--steel); background: var(--card); }
.search::before { content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-52%); color: var(--ink3); font-size: 18px; }
.sel { position: relative; } .sel select { appearance: none; padding: 8px 30px 8px 11px; border: 1px solid var(--steel); background: var(--card); cursor: pointer; min-width: 120px; font-size: 13px; }
.sel::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink3); font-size: 11px; }
.sel select.set { border-color: var(--ink); background: #fff; font-weight: 600; }
.view { margin-left: auto; } .view button { display: inline-flex; gap: 6px; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 26px; margin-bottom: 8px; font-size: 12.5px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--ink); background: #fff; padding: 2px 4px 2px 9px; }
.chip button { border: 0; background: none; cursor: pointer; padding: 0 4px; font-size: 14px; line-height: 1; }
.clear { border: 0; background: none; color: var(--blue); cursor: pointer; text-decoration: underline; font-size: 12.5px; }
.count { font-size: 13px; color: var(--ink2); margin: 2px 0 12px; } .count b { color: var(--ink); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--steel); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--ink); box-shadow: 0 6px 18px #0000000f; }
.card.preview { background: transparent; border-style: dashed; color: var(--ink2); }
.card .rank { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink3); display: flex; justify-content: space-between; align-items: center; }
.card h3 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700; } .card .by { font-size: 12.5px; color: var(--ink2); margin-top: -6px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); padding-top: 8px; }
.kpis div + div { border-left: 1px solid var(--rule); padding-left: 10px; } .kpis span { display: block; font: 600 10.5px "IBM Plex Mono", monospace; color: var(--ink3); letter-spacing: .05em; text-transform: uppercase; }
.kpis b { font-size: 20px; font-weight: 700; } .kpis b.p { color: var(--blue); font-size: 22px; } .kpis i { display: block; font-style: normal; font-size: 11px; color: var(--ink3); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; } .tag { font-size: 11.5px; border: 1px solid var(--rule); padding: 1px 8px; border-radius: 99px; background: #fff; white-space: nowrap; }
.tag.link { cursor: pointer; border-color: var(--blue); color: var(--blue); }
.stamp { font: 700 10px "IBM Plex Mono", monospace; border: 1.5px solid currentColor; padding: 0 6px; letter-spacing: .04em; }
.btns { display: flex; gap: 8px; margin-top: auto; } .btn { flex: 1; text-align: center; border: 1px solid var(--blue); color: var(--blue); background: #fff; padding: 7px 10px; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 13px; }
.btn.solid { background: var(--blue); color: #fff; } .btn:hover { filter: brightness(.95); }
details.rules { font-size: 12.5px; } details.rules summary { cursor: pointer; color: var(--ink2); } details.rules ul { margin: 6px 0 0; padding-left: 18px; } details.rules li { margin: 2px 0; }
details.rules .t { font: 700 10px "IBM Plex Mono", monospace; color: var(--ink3); margin-right: 4px; }
.cover { display: flex; gap: 14px; align-items: center; }
.cover .bk { width: 64px; height: 88px; flex: none; background: var(--c); color: #e8d39a; padding: 8px 6px; font: 600 9.5px/1.15 "Newsreader", serif; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 4px 0 6px -3px #0006, 2px 3px 6px #0002; border-radius: 1px 3px 3px 1px; }
.cover .bk.pv { background: repeating-linear-gradient(135deg, #d8d8d9 0 6px, #e4e4e5 6px 12px); color: var(--ink3); }
.cover .ph { width: 72px; height: 72px; flex: none; border-radius: 50%; overflow: hidden; background: #ddd; display: grid; place-items: center; font: 700 22px var(--font); color: var(--ink3); }
.cover .ph img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.strip text { font: 10px "IBM Plex Mono", monospace; fill: var(--ink3); }

/* table */
.tbl { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--steel); font-size: 13px; }
.tbl th { text-align: left; font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); padding: 10px 10px; border-bottom: 1px solid var(--steel); background: #f0f0f0; white-space: nowrap; cursor: pointer; user-select: none; }
.tbl th.on { color: var(--blue); } .tbl th.nosort { cursor: default; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; } .tbl tr:hover td { background: #fff; }
.tbl td.n, .tbl th.n { text-align: right; } .tbl td.n { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
.tbl td.p { color: var(--blue); font-weight: 700; } .tbl .nm b { display: block; font-size: 13.5px; } .tbl .nm span { font-size: 12px; color: var(--ink2); }
.tbl tr.preview td { color: var(--ink3); font-style: italic; } .tbl .rk { color: var(--ink3); font-family: "IBM Plex Mono", monospace; }
.tbl .go { border: 1px solid var(--blue); color: var(--blue); background: #fff; padding: 4px 10px; cursor: pointer; font-weight: 600; font-size: 12px; text-decoration: none; white-space: nowrap; }
.sep { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink2); border-top: 1px dashed var(--steel); padding-top: 10px; margin-top: 4px; }
.empty { border: 1px dashed var(--steel); padding: 40px; text-align: center; color: var(--ink2); background: var(--card); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.loading { padding: 40px; text-align: center; color: var(--ink2); }
@media (max-width: 1000px) { .hero { grid-template-columns: 1fr; } .page, .topbar { padding-left: 16px; padding-right: 16px; } .view { margin-left: 0; } .tblwrap { overflow-x: auto; } }
</style>
</head>
<body>
<header class="topbar"><a class="wordmark" href="./">STRATEGY VAULT</a><nav class="cats"><a class="on" href="#">Guru's</a><a>YT Strategies<em>soon</em></a></nav><div class="status" id="status"></div></header>
<main class="page">
  <div class="crumbs" id="crumbs"></div>
  <section class="hero">
    <div><h1 id="title">Explore the Vault</h1><p id="lede"></p>
      <div class="tree" id="tree"></div></div>
    <div class="dist" id="dist"></div>
  </section>

  <section class="controls">
    <div class="row"><span class="lab">Market</span><div class="seg" id="market"></div><div class="seg" id="index"></div></div>
    <div class="tabs" id="tabs"></div>
    <p class="tabnote" id="tabnote"></p>
    <div class="row">
      <label class="search"><input id="q" type="search" placeholder="Search strategies, books, gurus (e.g. RSI, VIX, short, scale-in)"></label>
      <span class="sel"><select id="f-guru" aria-label="Guru"></select></span>
      <span class="sel"><select id="f-book" aria-label="Book"></select></span>
      <span class="sel"><select id="f-style" aria-label="Style"></select></span>
    </div>
    <div class="row">
      <span class="sel"><select id="f-dir" aria-label="Direction"></select></span>
      <span class="sel"><select id="f-hold" aria-label="Holding period"></select></span>
      <span class="sel"><select id="f-verdict" aria-label="Verdict"></select></span>
      <span class="sel"><select id="f-min" aria-label="Minimum trades"></select></span>
      <span class="lab" style="margin-left:8px">Sort by</span><span class="sel"><select id="sort" aria-label="Sort by"></select></span>
      <div class="seg view" id="view"><button data-v="grid">▦ Grid</button><button data-v="table">☰ Table</button></div>
    </div>
    <div class="chips" id="chips"></div>
  </section>
  <div class="count" id="count"></div>
  <div id="out"><div class="loading">Loading the vault from the Rust API…</div></div>
</main>

<script>
const API = new URLSearchParams(location.search).get('api') || `http://${location.hostname || 'localhost'}:8090`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 1, s = false) => v == null || !isFinite(v) ? '–' : (s && v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const fx = (v, d = 2) => v == null || !isFinite(v) ? '–' : v.toFixed(d);
const cls = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
const med = a => { const s = a.filter(isFinite).sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const LABEL = { 'NIFTY 50': 'Nifty 50', NIFTYBANK: 'Bank Nifty', NIFTYIT: 'Nifty IT', NIFTYMIDCAP100: 'Midcap 100' };
const CLOTH = ['#1f3a5f', '#7a2e2e', '#2f5140', '#8a6a2f', '#4a5563', '#5b3b5e'];

// ---------------------------------------------------------------- the library (hierarchy: guru → book → strategy → variant)
// Only Connors / Swing Trading College IX is converted. The rest are clearly marked previews (no numbers) so the layout
// shows how the vault grows; they become live automatically once their strategies exist in the API.
const LIB = [
  { id: 'connors', name: 'Larry Connors', photo: 'img/gurus/connors.jpg', books: [
    { id: 'stc9', title: 'Swing Trading College IX', year: 2010, live: true },
    { id: 'stts', title: 'Short Term Trading Strategies That Work', year: 2008 },
    { id: 'hpetf', title: 'High Probability ETF Trading', year: 2009 }] },
  { id: 'raschke', name: 'Linda Raschke', books: [{ id: 'smarts', title: 'Street Smarts', year: 1995 }] },
  { id: 'minervini', name: 'Mark Minervini', books: [{ id: 'wizard', title: 'Trade Like a Stock Market Wizard', year: 2013 }, { id: 'champion', title: 'Think & Trade Like a Champion', year: 2017 }] },
  { id: 'oneil', name: "William O'Neil", books: [{ id: 'canslim', title: 'How to Make Money in Stocks', year: 1988 }] },
  { id: 'darvas', name: 'Nicolas Darvas', books: [{ id: 'darvas2m', title: 'How I Made $2,000,000 in the Stock Market', year: 1960 }] },
  { id: 'livermore', name: 'Jesse Livermore', books: [{ id: 'howtotrade', title: 'How to Trade in Stocks', year: 1940 }] },
];
const BOOK = {}; LIB.forEach(g => g.books.forEach((b, k) => { b.guru = g; b.c = CLOTH[(LIB.indexOf(g) * 2 + k) % CLOTH.length]; BOOK[b.id] = b; }));
const GURU = Object.fromEntries(LIB.map(g => [g.id, g]));

// ---------------------------------------------------------------- state (kept in the URL hash so any view can be shared)
const DEF = { mode: 'strategies', market: 'india', tk: 'NIFTY 50', tab: 'sharpe', q: '', guru: '', book: '', style: '', dir: '', hold: '', verdict: '', min: '0', family: '', sort: 'primary', view: 'grid' };
let S = { ...DEF };
const readHash = () => { const q = new URLSearchParams(location.hash.slice(1)); S = { ...DEF }; for (const k in DEF) if (q.has(k)) S[k] = q.get(k); };
const writeHash = () => { const q = new URLSearchParams(); for (const k in DEF) if (S[k] !== DEF[k]) q.set(k, S[k]); history.replaceState(null, '', '#' + q); };

let CAT = [], TICKERS = [], GURUS_API = [];
const SUM = {}; // `${tk}|${from}|${to}` -> { id: {stats, spark} }
async function getSum(tk, from = '', to = '') {
  const k = `${tk}|${from}|${to}`;
  const url = `${API}/api/guru/connors/summary?` + new URLSearchParams({ ticker: tk, from, to });
  const load = async (tries = 3) => { try { const a = await (await fetch(url)).json(); return Object.fromEntries(a.map(r => [r.id, r])); }
    catch (e) { if (tries <= 1) { delete SUM[k]; throw e; } await new Promise(r => setTimeout(r, 300)); return load(tries - 1); } };
  return SUM[k] || (SUM[k] = load());
}
// "before the book" numbers come from the per-strategy endpoint: the summary endpoint crashes when the end date
// is before the first India VIX bar (VIX strategies), while /run answers that case cleanly.
const PRE = {};
function preMap(tk, to) {
  const k = `${tk}|${to}`;
  if (PRE[k]) return PRE[k];
  const ids = CAT.filter(v => v.status === 'live' && !v.needs_vix).map(v => v.id), out = {}; // VIX data starts after 2009: nothing to ask
  let i = 0;
  const worker = async () => { while (i < ids.length) { const id = ids[i++];
    try { const r = await fetch(`${API}/api/guru/connors/run?` + new URLSearchParams({ id, ticker: tk, to })); if (r.ok) out[id] = { stats: (await r.json()).stats }; } catch (e) { /* leave missing */ } } };
  return PRE[k] = Promise.all(Array.from({ length: 6 }, worker)).then(() => out);
}
const lastOf = tk => TICKERS.find(t => t.ticker === tk)?.last || '2026-05-15';
const shiftYears = (d, y) => { const t = new Date(d); t.setFullYear(t.getFullYear() - y); return t.toISOString().slice(0, 10); };

// tabs: which data window each one uses and which number it ranks by
const PUB = 2010;
const TABS = {
  trending: { name: 'Trending', note: 'Ranked by the return of the last 12 months on the selected index: what is working right now.',
    win: tk => ({ from: shiftYears(lastOf(tk), 1), to: '' }), extra: () => ({ from: '', to: '' }),
    metric: { label: '12M return', get: r => r.s.total_return, fmt: v => pct(v, 1, true), bins: [-.1, -.05, 0, .05, .1, .2] }, keep: r => r.s.trades > 0 },
  sharpe: { name: 'Top Sharpe', note: 'Full history on the selected index, ranked by Sharpe ratio (rf = 0, daily, √252).',
    win: () => ({ from: '', to: '' }), metric: { label: 'Sharpe', get: r => r.s.sharpe, fmt: v => fx(v), bins: [0, .25, .5, .75, 1, 1.5] } },
  working: { name: 'Still working?', note: `Out-of-sample check: Sharpe since the book was published (${PUB}) next to Sharpe before it. A strategy that only worked before publication has decayed.`,
    win: () => ({ from: `${PUB}-01-01`, to: '' }), pre: `${PUB - 1}-12-31`,
    metric: { label: `Sharpe since ${PUB}`, get: r => r.s.sharpe, fmt: v => fx(v), bins: [0, .25, .5, .75, 1, 1.5] } },
  sig: { name: 'Significant', note: 'Only rule sets whose average trade is statistically significant: t-stat ≥ 2 with at least 30 closed trades.',
    win: () => ({ from: '', to: '' }), metric: { label: 't-stat', get: r => r.s.t_stat, fmt: v => fx(v), bins: [2, 2.5, 3, 4, 5, 6] }, keep: r => r.s.t_stat >= 2 && r.s.trades >= 30 },
  awaiting: { name: 'Awaiting data', note: 'Rules transcribed from the book that cannot be tested yet: they need data the vault does not have (TRIN breadth, options chains, single stocks).' },
};
const SORTS = { primary: 'Tab ranking', sharpe: 'Sharpe', cagr: 'CAGR', maxdd: 'Smallest drawdown', win: 'Win rate', pf: 'Profit factor', trades: 'Most trades', t: 't-stat', name: 'Name (A–Z)', course: 'Order in the book' };
const sortVal = (r, k) => ({ primary: TABS[S.tab].metric?.get(r), sharpe: r.s.sharpe, cagr: r.s.cagr, maxdd: r.s.max_dd, win: r.s.win_rate, pf: r.s.profit_factor, trades: r.s.trades, t: r.s.t_stat }[k]);
function sortRows(rows) {
  const k = S.sort;
  if (k === 'name') return rows.sort((a, b) => a.v.family_name.localeCompare(b.v.family_name));
  if (k === 'course') return rows.sort((a, b) => a.v.ord - b.v.ord);
  return rows.sort((a, b) => (sortVal(b, k) ?? -1e9) - (sortVal(a, k) ?? -1e9));
}
const verdictOf = s => s.trades < 30 ? { k: 'thin', t: 'THIN DATA', c: '#8a3a2e' } : s.t_stat >= 2 ? { k: 'sig', t: 'SIGNIFICANT', c: '#2e7d4f' } : { k: 'none', t: 'NO EDGE', c: '#6b6f78' };
const holdOf = s => s.avg_bars <= 5 ? 'short' : s.avg_bars <= 20 ? 'swing' : 'long';
const HOLD = { short: '≤ 5 bars', swing: '6–20 bars', long: '> 20 bars' };

// ---------------------------------------------------------------- rows: one per (variant × index) after market, tab and filters
async function rows() {
  if (S.market !== 'india') return [];
  const T = TABS[S.tab], tks = S.tk === 'ALL' ? TICKERS.map(t => t.ticker) : [S.tk];
  const qq = S.q.trim().toLowerCase();
  const textOk = v => !qq || `${v.name} ${v.family_name} ${v.variant || ''} ${v.group} ${v.dir} ${BOOK[v.book].title} ${GURU[v.guru].name} ${(v.rules || []).join(' ')}`.toLowerCase().includes(qq);
  const metaOk = v => textOk(v) && (!S.guru || v.guru === S.guru) && (!S.book || v.book === S.book) && (!S.style || v.style === S.style) && (!S.dir || v.dir === S.dir) && (!S.family || v.family === S.family);
  if (S.tab === 'awaiting') return CAT.filter(v => v.status !== 'live' && metaOk(v)).map(v => ({ v, tk: null, s: null }));
  const out = [];
  for (const tk of tks) {
    const w = T.win(tk), main = await getSum(tk, w.from, w.to), ex = T.extra ? T.extra(tk) : null, extra = ex ? await getSum(tk, ex.from, ex.to) : T.pre ? await preMap(tk, T.pre) : null;
    for (const v of CAT) {
      if (v.status !== 'live' || !metaOk(v)) continue;
      const m = main[v.id]; if (!m?.stats || !m.stats.trades) continue; // no data (volume rules on Nifty IT) or no closed trades in the window
      const r = { v, tk, s: m.stats, sp: m.spark, x: extra?.[v.id]?.stats || null, w };
      if (T.keep && !T.keep(r)) continue;
      if (S.hold && holdOf(r.s) !== S.hold) continue;
      if (S.verdict && verdictOf(r.s).k !== S.verdict) continue;
      if (r.s.trades < +S.min) continue;
      out.push(r);
    }
  }
  return sortRows(out);
}

// ---------------------------------------------------------------- small charts
function spark(r, w = 300, h = 86) {
  const a = r.sp || []; if (a.length < 2) return '';
  const L = Math.log, lo = Math.min(...a.map(L)), hi = Math.max(...a.map(L)), n = a.length;
  const X = i => i / (n - 1) * w, Y = v => h - 4 - (L(v) - lo) / ((hi - lo) || 1) * (h - 10);
  const P = a.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const end = new Date(r.w.to || lastOf(r.tk)), start = new Date(end - r.s.years * 365.25 * 864e5);
  const f = (new Date(`${PUB}-01-01`) - start) / (end - start);
  const mark = f > .03 && f < .97 ? `<rect x="${f * w}" y="0" width="${(1 - f) * w}" height="${h}" fill="var(--blue-soft)" opacity=".55"/><line x1="${f * w}" x2="${f * w}" y1="0" y2="${h}" stroke="var(--blue)" stroke-dasharray="3 3" stroke-width="1"/>` : '';
  const small = w < 200; // table rows: no axis labels, the dashed line still marks the book
  return `<svg viewBox="0 0 ${w} ${h + (small ? 0 : 14)}" width="100%" class="strip" role="img" aria-label="Equity curve${mark ? `; shaded part is after the book (${PUB})` : ''}">${mark}<path d="${P}L${w},${h}L0,${h}Z" fill="var(--blue)" opacity=".08"/><path d="${P}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
    ${small ? '' : `<text x="0" y="${h + 12}">${start.getFullYear()}</text>${mark ? `<text x="${f * w}" y="${h + 12}" text-anchor="middle" fill="var(--blue)">book ${PUB} →</text>` : ''}<text x="${w}" y="${h + 12}" text-anchor="end">${end.getFullYear()}</text>`}</svg>`;
}
// strip plot: every strategy of a guru/book as a dot on the tab's metric axis
function stripPlot(vals, w = 300, h = 34) {

  return `<svg viewBox="0 0 ${w} ${h + 12}" width="100%" class="strip" role="img" aria-label="Spread of ${esc(M.label)}"><line x1="6" x2="${w - 6}" y1="${h / 2}" y2="${h / 2}" stroke="var(--rule)"/>
    ${vals.map((v, i) => `<circle cx="${X(v).toFixed(1)}" cy="${h / 2 + ((i % 3) - 1) * 6}" r="4" fill="var(--blue)" opacity=".55"/>`).join('')}

}
function distBox(rs) {
  const M = TABS[S.tab].metric;
  if (!M || !rs.length) return `<div class="h"><b>Where this view sits</b><span>${rs.length} RESULTS</span></div><div class="muted" style="font-size:13px;padding:20px 0">${S.tab === 'awaiting' ? 'No numbers yet: these rules need data the vault does not have.' : 'Nothing to chart for this selection.'}</div>`;
  const b = M.bins, edges = [-Infinity, ...b, Infinity], vals = rs.map(M.get), cnt = Array(edges.length - 1).fill(0);
  vals.forEach(v => { for (let i = 0; i < cnt.length; i++) if (v >= edges[i] && v < edges[i + 1]) { cnt[i]++; break; } });
  const mx = Math.max(...cnt), W = 420, H = 86, bw = W / cnt.length, md = med(vals);
  const lbl = i => i === 0 ? `<${M.fmt(b[0])}` : i === cnt.length - 1 ? `≥${M.fmt(b[b.length - 1])}` : `${M.fmt(edges[i])}–${M.fmt(edges[i + 1])}`;
  const mi = cnt.findIndex((_, i) => md >= edges[i] && md < edges[i + 1]);
  const top = rs.slice(0, 12).map(M.get);
  return `<div class="h"><b>Where this view sits</b><span>${rs.length} RESULTS · ${S.tk === 'ALL' ? 'ALL INDICES' : esc(LABEL[S.tk]).toUpperCase()}</span></div>
    <svg viewBox="0 0 ${W} ${H + 18}" width="100%" class="strip" role="img" aria-label="Distribution of ${esc(M.label)}">${cnt.map((c, i) => { const hh = c / (mx || 1) * (H - 16); const inTop = top.some(v => v >= edges[i] && v < edges[i + 1]);
      return `<rect x="${i * bw + 2}" y="${H - hh}" width="${bw - 4}" height="${Math.max(1, hh)}" fill="${inTop ? 'var(--blue)' : '#dfe6ef'}"><title>${lbl(i)}: ${c}</title></rect><text x="${i * bw + bw / 2}" y="${H + 14}" text-anchor="middle">${lbl(i)}</text>${c ? `<text x="${i * bw + bw / 2}" y="${H - hh - 3}" text-anchor="middle" fill="var(--ink)">${c}</text>` : ''}`; }).join('')}
      ${mi >= 0 ? `<line x1="${mi * bw + bw / 2}" x2="${mi * bw + bw / 2}" y1="0" y2="${H}" stroke="var(--ink)" stroke-dasharray="2 2"/>` : ''}</svg>
    <div class="foot"><span>Dashed line = median ${M.fmt(md)} · top 12 shown first: ${M.label} ${M.fmt(Math.min(...top))} to ${M.fmt(Math.max(...top))}</span><span>dark = where they sit</span></div>`;

  $('#market').innerHTML = [['india', 'India'], ['global', 'Global'], ['stocks', 'Stocks']].map(([k, t]) => `<button data-market="${k}" class="${S.market === k ? 'on' : ''} ${k !== 'india' ? 'soon' : ''}">${t}${k !== 'india' ? '<small>soon</small>' : ''}</button>`).join('');
  $('#index').hidden = S.market !== 'india';
  $('#index').innerHTML = [...TICKERS.map(t => [t.ticker, LABEL[t.ticker] || t.ticker]), ['ALL', 'All indices']].map(([k, t]) => `<button data-tk="${esc(k)}" class="${S.tk === k ? 'on' : ''}">${esc(t)}</button>`).join('');
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${t.name}${k === 'awaiting' ? `<small>${CAT.filter(v => v.status !== 'live').length}</small>` : ''}</button>`).join('');
  $('#tabnote').textContent = TABS[S.tab].note;
  opts('f-guru', 'Guru: all', LIB.map(g => [g.id, g.name + (g.books.some(b => b.live) ? '' : ' (soon)')]), S.guru);
  opts('f-book', 'Book: all', Object.values(BOOK).filter(b => !S.guru || b.guru.id === S.guru).map(b => [b.id, `${b.title}${b.live ? '' : ' (soon)'}`]), S.book);
  opts('f-style', 'Style: all', [...new Set(CAT.map(v => v.style))].map(s => [s, s]), S.style);
  opts('f-dir', 'Direction: all', [['Long', 'Long'], ['Short', 'Short']], S.dir);
  opts('f-hold', 'Holding: any', Object.entries(HOLD), S.hold);
  opts('f-verdict', 'Verdict: any', [['sig', 'Significant (t ≥ 2)'], ['none', 'No edge'], ['thin', 'Thin data (< 30 trades)']], S.verdict);
  opts('f-min', 'Min trades: any', [['10', '≥ 10 trades'], ['30', '≥ 30 trades'], ['100', '≥ 100 trades']], S.min === '0' ? '' : S.min);
  const so = $('#sort'); so.innerHTML = Object.entries(SORTS).map(([k, t]) => `<option value="${k}">${k === 'primary' ? `${t} (${TABS[S.tab].metric?.label || 'none'})` : t}</option>`).join(''); so.value = S.sort;
  document.querySelectorAll('#view button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  $('#q').value = S.q;
  const chip = (k, t) => `<span class="chip">${esc(t)}<button data-unset="${k}" aria-label="Remove ${esc(t)}">×</button></span>`;
  const on = [S.guru && chip('guru', 'Guru: ' + GURU[S.guru].name), S.book && chip('book', 'Book: ' + BOOK[S.book].title), S.family && chip('family', 'Strategy: ' + (CAT.find(v => v.family === S.family)?.family_name || S.family)), S.style && chip('style', 'Style: ' + S.style), S.dir && chip('dir', S.dir),
    S.hold && chip('hold', 'Holding ' + HOLD[S.hold]), S.verdict && chip('verdict', { sig: 'Significant', none: 'No edge', thin: 'Thin data' }[S.verdict]), S.min !== '0' && chip('min', '≥ ' + S.min + ' trades'), S.q && chip('q', '“' + S.q + '”')].filter(Boolean);
  $('#chips').innerHTML = on.length ? on.join('') + '<button class="clear" id="clear">Clear all</button>' : '<span class="muted">No filters. Combine market, tab and filters; every view works in grid or table.</span>';
  // breadcrumb + heading follow the hierarchy
  const cr = [`<a data-crumb="root">Guru's</a>`]; if (S.guru) cr.push(`<a data-crumb="guru">${esc(GURU[S.guru].name)}</a>`); if (S.book) cr.push(`<a data-crumb="book">${esc(BOOK[S.book].title)}</a>`); if (S.family) cr.push(`<b>${esc(CAT.find(v => v.family === S.family)?.family_name || '')}</b>`);
  $('#crumbs').innerHTML = cr.join(' &nbsp;/&nbsp; ');
  const what = { gurus: 'Gurus', books: 'Books', strategies: 'Strategies', variants: 'Rule variants' }[S.mode];
  $('#title').textContent = S.tab === 'awaiting' ? 'Awaiting data' : `${TABS[S.tab].name} ${what.toLowerCase()}`;
  $('#lede').innerHTML = `Browse the vault by <b>guru</b>, <b>book</b>, <b>strategy</b> or every <b>rule variant</b>; pick the <b>market</b>; then rank with the tabs and narrow with filters. ${S.market === 'india' ? `Results on ${S.tk === 'ALL' ? 'all four Indian indices' : esc(LABEL[S.tk])}, cost 0 bps.` : ''}`;
  $('#status').textContent = S.market === 'india' ? `India · ${S.tk === 'ALL' ? 'all indices' : LABEL[S.tk]} · ${TABS[S.tab].name}` : `${S.market} · no data yet`;
}

let busy = 0;
async function render() {
  writeHash();
  const my = ++busy;
  controls();
  if (S.market !== 'india') {
    $('#dist').innerHTML = distBox([]); $('#count').innerHTML = '';
    $('#out').innerHTML = `<div class="empty"><b>${S.market === 'global' ? 'Global markets' : 'Single stocks'}: no data loaded yet</b>${S.market === 'global' ? 'S&amp;P 500, Nasdaq 100, DAX, FTSE, Nikkei…' : 'Nifty 500 constituents, F&amp;O stocks…'} The same gurus, books and strategies will be listed here once the data is added to the Rust backend; every tab, filter and the grid/table switch already work the same way.</div>`;
    return;
  }
  $('#out').style.opacity = .5;
  const rs = await rows(); if (my !== busy) return;
  $('#out').style.opacity = 1;
  $('#dist').innerHTML = distBox(S.mode === 'strategies' && S.tab !== 'awaiting' ? [...groupBy(rs, r => r.v.family).values()].map(a => a[0]) : rs);
  const fam = new Set(rs.map(r => r.v.family)).size, books = new Set(rs.map(r => r.v.book)).size, gur = new Set(rs.map(r => r.v.guru)).size;
  $('#count').innerHTML = `<b>${fam}</b> strategies · <b>${new Set(rs.map(r => r.v.id)).size}</b> rule variants · <b>${books}</b> book${books === 1 ? '' : 's'} · <b>${gur}</b> guru${gur === 1 ? '' : 's'}${S.tk === 'ALL' && S.tab !== 'awaiting' ? ` · <b>${rs.length}</b> index results` : ''}`;
  if (!rs.length && S.mode !== 'gurus' && S.mode !== 'books') { $('#out').innerHTML = `<div class="empty"><b>Nothing matches</b>Remove a filter or switch tab.</div>`; return; }
  $('#out').innerHTML = S.mode === 'gurus' ? viewGurus(rs) : S.mode === 'books' ? viewBooks(rs) : viewStrategies(rs, S.mode === 'variants');
}

// ---------------------------------------------------------------- events
const set = patch => { Object.assign(S, patch); render(); };
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, .tag, th'); if (!t) return;
  const d = t.dataset;
  if (d.mode) return set({ mode: d.mode });
  if (d.market) return set({ market: d.market });
  if (d.tk) return set({ tk: d.tk });
  if (d.tab) return set({ tab: d.tab, sort: 'primary' });
  if (d.v) return set({ view: d.v });
  if (d.sort) return set({ sort: d.sort });
  if (d.unset) return set({ [d.unset]: d.unset === 'min' ? '0' : '' });
  if (t.id === 'clear') return set({ q: '', guru: '', book: '', style: '', dir: '', hold: '', verdict: '', min: '0', family: '' });
  if (d.fam) { e.preventDefault(); return set({ family: d.fam, mode: 'variants' }); }
  if (d.book) return set({ book: d.book, guru: BOOK[d.book].guru.id, mode: 'strategies' });
  if (d.guru) return set({ guru: d.guru, book: '', mode: 'books' });
  if (d.guruStrats) return set({ guru: d.guruStrats, book: '', mode: 'strategies' });
  if (d.crumb === 'root') return set({ guru: '', book: '', family: '', mode: 'gurus' });
  if (d.crumb === 'guru') return set({ book: '', family: '', mode: 'books' });
  if (d.crumb === 'book') return set({ family: '', mode: 'strategies' });
});
const sel = (id, key) => $('#' + id).addEventListener('change', e => set({ [key]: e.target.value || (key === 'min' ? '0' : ''), ...(key === 'guru' ? { book: '' } : {}) }));
[['f-guru', 'guru'], ['f-book', 'book'], ['f-style', 'style'], ['f-dir', 'dir'], ['f-hold', 'hold'], ['f-verdict', 'verdict'], ['f-min', 'min'], ['sort', 'sort']].forEach(([i, k]) => sel(i, k));
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; render().then(() => $('#q').focus()); }, 200); });
addEventListener('hashchange', () => { readHash(); render(); });

(async function init() {
  try {
    const get = async u => (await fetch(API + u)).json();
    const [cat, tk, gurus] = await Promise.all([get('/api/guru/connors/strategies'), get('/api/tickers'), get('/api/gurus')]);
    TICKERS = tk; GURUS_API = gurus;
    CAT = cat.map((v, i) => ({ ...v, ord: i, guru: 'connors', book: 'stc9', style: v.group.split(' · ')[0] }));
    readHash(); render();
  } catch (e) { $('#out').innerHTML = `<div class="empty"><b>Could not reach the Rust API</b>${esc(API)}: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
