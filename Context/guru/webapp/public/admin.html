<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts · Strategy Vault</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/login.css"><script src="/admin.js" defer></script></head><body><header><a class="wordmark" href="/">STRATEGY VAULT</a><div class="toolbar"><a href="/">Back to research</a><button id="signout">Sign out</button></div></header><main class="admin-main"><span class="eyebrow">ADMINISTRATION</span><h1>Workspace accounts</h1><p class="muted">Give each person their own login and access level.</p><p class="message" id="message" role="alert"></p><div class="admin-grid"><section class="panel"><h2>Create an account</h2><form id="user-form"><label for="name">Name</label><input id="name" required maxlength="100" autocomplete="name"><label for="email">Email address</label><input id="email" type="email" required autocomplete="off"><label for="role">Access level</label><select id="role"><option value="researcher">Researcher — run, optimize and save conclusions</option><option value="viewer">Viewer — run strategies and read conclusions</option><option value="admin">Administrator — researcher tools and accounts</option></select><label for="password">Initial password</label><input id="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><p class="muted">At least 12 characters. Share it with this person privately.</p><button id="create" type="submit">Create account</button></form></section><section><div class="users-wrap"><table class="users"><thead><tr><th>Name</th><th>Email</th><th>Access</th></tr></thead><tbody id="users"></tbody></table></div></section></div></main></body></html>
